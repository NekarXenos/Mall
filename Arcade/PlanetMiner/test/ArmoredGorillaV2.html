<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Cyberpunk Gorilla</title>
    <style>
        /* Basic styling for the body and canvas to ensure full-screen rendering */
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333333; /* Darker background for cyberpunk theme */
        }
        canvas {
            display: block; /* Remove extra space below canvas */
            width: 100vw; /* Make canvas fill viewport width */
            height: 100vh; /* Make canvas fill viewport height */
            background-color: #333333; 
        }
    </style>
</head>
<body>
    <!-- Import Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Import OrbitControls for interactive camera navigation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene, camera, renderer, and controls
        let scene, camera, renderer, controls;
        
        // Gorilla and animation variables
        let gorillaGroup;
        let leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup;
        let leftForearmGroup, rightForearmGroup, leftLowerLegGroup, rightLowerLegGroup;
        let clock, velocity, speed, worldBoundary;

        // --- Animation and Movement Speed Controls ---
        const MOVEMENT_SPEED = 0.04;
        const WALK_ANIMATION_SPEED = 6;

        // State variables for behavior
        let gorillaState = 'walking'; // 'walking' or 'mining'
        let actionTimer = 0;
        const walkDuration = 5; // seconds
        const mineDuration = 2; // seconds

        // Ensure the script runs only after the entire window content is loaded
        window.onload = function() {
            init(); // Initialize the Three.js scene
            animate(); // Start the animation loop
        };

        /**
         * Initializes the Three.js scene, camera, renderer, lighting,
         * and constructs the gorilla character with armor.
         */
        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); // Dark background
            scene.fog = new THREE.Fog(0x333333, 30, 100); // Add fog for atmosphere
            
            // Initialize clock for animation timing
            clock = new THREE.Clock();

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Enable shadows
            document.body.appendChild(renderer.domElement);

            // 4. OrbitControls for Camera Interaction
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 5. Lighting Setup
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 13, 7);
            directionalLight.castShadow = true; // Light casts shadows
            scene.add(directionalLight);
            
            // Point light for dramatic effect
            const pointLight = new THREE.PointLight(0xffd700, 1.5, 100);
            pointLight.position.set(0, 13, 10);
            scene.add(pointLight);


            // 6. Materials
            const gorillaMaterial = new THREE.MeshStandardMaterial({ color: 0x36454F });
            const blueFurMaterial = new THREE.MeshStandardMaterial({ color: 0x113366 });
            // --- NEW: Armor Material ---
            const armorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xFFD700, // Bright yellow/gold
                metalness: 0.7, 
                roughness: 0.3 
            });
            const hydraulicMaterial = new THREE.MeshStandardMaterial({
                color: 0xaaaaaa,
                metalness: 0.9,
                roughness: 0.2
            });


            // 7. Create Gorilla Group
            gorillaGroup = new THREE.Group();
            gorillaGroup.castShadow = true;
            gorillaGroup.receiveShadow = true;
            
            // Initialize velocity with a random direction
            velocity = new THREE.Vector3(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
            speed = MOVEMENT_SPEED;

            // 8. Body
            const bodyGeometry = new THREE.DodecahedronGeometry(1); // THREE.BoxGeometry(4, 5, 3); 
            const body = new THREE.Mesh(bodyGeometry, blueFurMaterial);
            body.scale.set(2.5, 3.5, 2); // 
            // Adjusted body position to overlap with thighs more
            body.rotation.x = -0.3;
            body.position.set(0, 2.25, -0.5); // Original y was 4
            gorillaGroup.add(body);

            // --- NEW: Chest Armor ---
/*             const chestPlateGeo = new THREE.BoxGeometry(4.5, 4, 2);
            const chestPlate = new THREE.Mesh(chestPlateGeo, armorMaterial);
            // Adjusted chest plate position relative to new body position
            chestPlate.position.set(0, 2.75, 0.5); // Original y was 4.5
            chestPlate.rotation.x = 0.3;
            gorillaGroup.add(chestPlate); */

            // 9. Head
            const headGeometry = new THREE.DodecahedronGeometry(2);
            const head = new THREE.Mesh(headGeometry, gorillaMaterial);
            // Adjusted head position relative to new body position
            head.rotation.x = 0.1;
            head.position.set(0, 5.75, -0.5); // Original y was 7.5
            gorillaGroup.add(head);

            // 11. Lips (Squashed Donut / TorusGeometry)
            const lipsGeometry = new THREE.TorusGeometry(0.7, 0.9, 6, 6);
            const lips = new THREE.Mesh(lipsGeometry, gorillaMaterial);
            lips.rotation.z = Math.PI / 2; // Rotate to be horizontal
            lips.scale.set(0.5, 1, 1.2); // Scale Y-axis to squash, Z-axis for slight protrusion
            lips.position.set(head.position.x, head.position.y -0.6, head.position.z -1.2); 
            // .position.set(0, 7, 1.7); // Position on the front of the head // head.position.set(0, 5.75, 0.5); 
            lips.rotation.x = -Math.PI / 6; // Rotate to be horizontal
            gorillaGroup.add(lips);

            // 12. Nose (Dodecahedron)
            const noseGeometry = new THREE.DodecahedronGeometry(0.5);
            const nose = new THREE.Mesh(noseGeometry, gorillaMaterial);
            nose.scale.set(1, 0.5, 1); 
            nose.position.set(head.position.x, head.position.y , head.position.z -1.7); 
            // .position.set(0, 7.75, 2.3); // Position on the front of the head //  head.position.set(0, 5.75, 0.5); 
            gorillaGroup.add(nose);

            // 13. Eyes (Icosahedrons)
            const eyeGeometry = new THREE.IcosahedronGeometry(0.2, 1); // Using Icosahedron for better roundness
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x001122, roughness: 0.1, metalness: 0.1 }); // Black color for eyes
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(head.position.x-0.4, head.position.y + 0.25, head.position.z -1.7); 
            // .position.set(-0.5, 8, 2.2); // Position on the head //  head.position.set(0, 5.75, 0.5); 
            gorillaGroup.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(head.position.x+0.4, head.position.y + 0.25, head.position.z -1.7); 
            // .position.set(0.5, 8, 2.2); // Position on the head //  head.position.set(0, 5.75, 0.5); 
            gorillaGroup.add(rightEye);
            
            // --- NEW: Mining Helmet ---
            const helmetGeo = new THREE.DodecahedronGeometry(2, 0);
            const helmet = new THREE.Mesh(helmetGeo, armorMaterial);
            //helmet.rotation.x = Math.PI / 6; // Rotate to point forward
            //helmet.position.copy(head.position); // This will automatically update
            helmet.position.set(head.position.x, head.position.y + 0.75, head.position.z + 0.1);
            gorillaGroup.add(helmet);
            
            const helmetTorchGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 6); // BoxGeometry(0.5, 3, 0.5);
            const helmetTorch = new THREE.Mesh(helmetTorchGeo, hydraulicMaterial);
            helmetTorch.rotation.x = -Math.PI / 2; // Rotate to point forward
            // Adjusted helmet Torch position relative to new head position
            helmetTorch.position.set(0, head.position.y + 2, head.position.z - 1);
            gorillaGroup.add(helmetTorch);


            // --- Helper function to create a jointed limb ---
            function createJointedLimb(limbLength, limbRadius, rotationPointOffset, isArm) {
                const limbGroup = new THREE.Group();
                const baseDodecahedronRadius = 1;

                const upperPartGeometry = new THREE.DodecahedronGeometry(baseDodecahedronRadius, 0); 
                const upperPart = new THREE.Mesh(upperPartGeometry, blueFurMaterial);
                upperPart.scale.set(limbRadius / baseDodecahedronRadius, limbLength / (baseDodecahedronRadius * 2), limbRadius / baseDodecahedronRadius);
                upperPart.position.y = -limbLength / 2;
                limbGroup.add(upperPart);

                const lowerPartGroup = new THREE.Group();
                lowerPartGroup.position.y = -limbLength - rotationPointOffset;
                limbGroup.add(lowerPartGroup);

                const lowerLimbRadius = isArm ? limbRadius * 1.2 : limbRadius;
                const lowerLimbLength = isArm ? limbLength * 1.2 : limbLength;
                const lowerPartGeometry = new THREE.DodecahedronGeometry(baseDodecahedronRadius, 0); 
                const lowerPart = new THREE.Mesh(lowerPartGeometry, blueFurMaterial);
                lowerPart.scale.set(lowerLimbRadius / baseDodecahedronRadius, lowerLimbLength / (baseDodecahedronRadius * 2), lowerLimbRadius / baseDodecahedronRadius);
                lowerPart.position.y = -lowerLimbLength / 2;
                lowerPartGroup.add(lowerPart);

                return { limbGroup, lowerPartGroup };
            }
            
            // --- Helper function for Hydraulic Cylinders ---
            function createHydraulic(length) {
                const group = new THREE.Group();
                const outerGeo = new THREE.CylinderGeometry(0.3, 0.3, length, 6);
                const outerCylinder = new THREE.Mesh(outerGeo, armorMaterial);
                outerCylinder.position.y = -length / 2;
                group.add(outerCylinder);

                const pistonGeo = new THREE.CylinderGeometry(0.15, 0.15, length, 8);
                const piston = new THREE.Mesh(pistonGeo, hydraulicMaterial);
                piston.position.y = -length / 2;
                
                const pistonGroup = new THREE.Group();
                pistonGroup.add(piston);
                
                return { outer: group, piston: pistonGroup };
            }


            // 16. Arms & Armor
            const armLength = 4.5;
            const armRadius = 0.9;
            const elbowOffset = -2;

            // --- NEW: Shoulder Pauldrons ---
            const pauldronGeo = new THREE.CylinderGeometry(1.1, 2.1, 3, 6); // SphereGeometry(2, 4, 4);
            const leftPauldron = new THREE.Mesh(pauldronGeo, armorMaterial);
            leftPauldron.rotation.z = Math.PI * 0.4; // Rotate to point sideways
            leftPauldron.position.set(-2, 4, 0);
            gorillaGroup.add(leftPauldron);

            const rightPauldron = leftPauldron.clone();
            rightPauldron.rotation.y = Math.PI ; // mirror the left pauldron
            rightPauldron.position.x = -leftPauldron.position.x;
            gorillaGroup.add(rightPauldron);

            // Left Arm
            const leftArmData = createJointedLimb(armLength, armRadius, elbowOffset, true);
            leftArmGroup = leftArmData.limbGroup;
            leftForearmGroup = leftArmData.lowerPartGroup;
            leftArmGroup.position.set(-2.5, 5.5, 0);
            gorillaGroup.add(leftArmGroup);
            
            // Left Hand (Dodecahedron)
            const handGeometry = new THREE.DodecahedronGeometry(1.3);
            const leftHand = new THREE.Mesh(handGeometry, gorillaMaterial);
            leftHand.position.y = -(armLength * 0.9) - 0.4; // Position at the end of the forearm
            leftHand.position.z = 0.3; // Position at the end of the forearm
            leftForearmGroup.add(leftHand); // Add hand to the forearm group


            // Right Arm
            const rightArmData = createJointedLimb(armLength, armRadius, elbowOffset, true);
            rightArmGroup = rightArmData.limbGroup;
            rightForearmGroup = rightArmData.lowerPartGroup;
            rightArmGroup.position.set(2.5, 5.5, 0);
            gorillaGroup.add(rightArmGroup);

            
            // Right Hand (Dodecahedron)
            const rightHand = new THREE.Mesh(handGeometry, gorillaMaterial);
            rightHand.position.y = -(armLength * 0.9) - 0.4; // Position at the end of the forearm
            rightHand.position.z = 0.3; // Position at the end of the forearm
            rightForearmGroup.add(rightHand); // Add hand to the forearm group

            
            // --- NEW: Arm Hydraulics & Gauntlets ---
            const gauntletGeo = new THREE.CylinderGeometry(1.2, 1, 3, 5);
            const leftGauntlet = new THREE.Mesh(gauntletGeo, armorMaterial);
            leftGauntlet.position.y = -2;
            leftForearmGroup.add(leftGauntlet);
            const rightGauntlet = leftGauntlet.clone();
            rightForearmGroup.add(rightGauntlet);

            const leftArmHydraulic = createHydraulic(2.5);
            leftArmHydraulic.outer.position.set(-1, -0.2, 0);
            leftArmHydraulic.piston.position.set(-1, 0.2, 0);
            leftArmGroup.add(leftArmHydraulic.outer);
            leftForearmGroup.add(leftArmHydraulic.piston);
            
            const rightArmHydraulic = createHydraulic(2.5);
            rightArmHydraulic.outer.position.set(1, -0.2, 0);
            rightArmHydraulic.piston.position.set(1, 0.2, 0);
            rightArmGroup.add(rightArmHydraulic.outer);
            rightForearmGroup.add(rightArmHydraulic.piston);


            // 17. Legs & Armor
            const legLength = 3.5;
            const legRadius = 1;
            const kneeOffset = -1;

            // Left Leg
            const leftLegData = createJointedLimb(legLength, legRadius, kneeOffset, false);
            leftLegGroup = leftLegData.limbGroup;
            leftLowerLegGroup = leftLegData.lowerPartGroup;
            leftLegGroup.position.set(-1.2, 1.5, 1.5);
            gorillaGroup.add(leftLegGroup);
            
            // Left Foot (Dodecahedron)
            const footGeometry = new THREE.DodecahedronGeometry(1);
            footGeometry.scale(1.2, 0.5, 2); // Scale to make it flatter and wider
            const leftFoot = new THREE.Mesh(footGeometry, gorillaMaterial);
            leftFoot.position.y = -(legLength * 0.9) - 0.5; // Position at the end of the lower leg
            leftFoot.rotation.x =-0.4; // Rotate to be flat on the ground
            leftLowerLegGroup.add(leftFoot); // Add foot to the lower leg group


            // Right Leg
            const rightLegData = createJointedLimb(legLength, legRadius, kneeOffset, false);
            rightLegGroup = rightLegData.limbGroup;
            rightLowerLegGroup = rightLegData.lowerPartGroup;
            rightLegGroup.position.set(1.2, 1.5, 1.5);
            gorillaGroup.add(rightLegGroup);

            // Right Foot (Dodecahedron)
            const rightFoot = new THREE.Mesh(footGeometry, gorillaMaterial);
            rightFoot.position.y = -(legLength * 0.9) - 0.5; // Position at the end of the lower leg
            rightFoot.rotation.x = -0.4; // Rotate to be flat on the ground
            rightLowerLegGroup.add(rightFoot); // Add foot to the lower leg group

            // --- NEW: Leg Hydraulics & Greaves ---
            const greaveGeo = new THREE.CylinderGeometry(1.2, 1, 3, 5);
            const leftGreave = new THREE.Mesh(greaveGeo, armorMaterial);
            leftGreave.position.y = -2;
            leftLowerLegGroup.add(leftGreave);
            const rightGreave = leftGreave.clone();
            rightLowerLegGroup.add(rightGreave);
            
            const leftLegHydraulic = createHydraulic(2);
            leftLegHydraulic.outer.position.set(0, -0.5, 1);
            leftLegHydraulic.piston.position.set(0, 0, 1);
            leftLegGroup.add(leftLegHydraulic.outer);
            leftLowerLegGroup.add(leftLegHydraulic.piston);

            const rightLegHydraulic = createHydraulic(2);
            rightLegHydraulic.outer.position.set(0, -0.5, 1);
            rightLegHydraulic.piston.position.set(0, 0, 1);
            rightLegGroup.add(rightLegHydraulic.outer);
            rightLowerLegGroup.add(rightLegHydraulic.piston);


            // Add the entire gorilla group to the scene
            scene.add(gorillaGroup);

            // Scale gorilla to 2 units tall and place on ground.
            gorillaGroup.scale.set(0.147, 0.147, 0.147);
            gorillaGroup.position.y = 0.76;

            // 18. Ground Plane
            const planeSize = 10;
            worldBoundary = planeSize / 2 - 0.5; // Set world boundary based on plane size
            const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize);
            const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.2, roughness: 0.8 });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true; // Plane receives shadows
            plane.position.y = 0; // Keep ground at the same level
            scene.add(plane);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta(); // Get time elapsed since last frame
            actionTimer += deltaTime; // Update action timer

            const time = clock.getElapsedTime() * WALK_ANIMATION_SPEED; // For walking animation

            // --- Walking Animation ---
            const walkAmplitude = 0.5;
            const kneeBendAmplitude = 0.8;

            // Only animate walking if in 'walking' state
            if (gorillaState === 'walking') {
                leftLegGroup.rotation.x = -Math.sin(time) * walkAmplitude;
                rightLegGroup.rotation.x = -Math.sin(time + Math.PI) * walkAmplitude;
                leftArmGroup.rotation.x = -Math.sin(time + Math.PI) * walkAmplitude * 1.2;
                rightArmGroup.rotation.x = -Math.sin(time) * walkAmplitude * 1.2;

                leftLowerLegGroup.rotation.x = -Math.max(0, Math.sin(time + Math.PI / 4)) * kneeBendAmplitude;
                rightLowerLegGroup.rotation.x = -Math.max(0, Math.sin(time + Math.PI + Math.PI / 4)) * kneeBendAmplitude;
                leftForearmGroup.rotation.x = Math.max(0, Math.sin(time + Math.PI + Math.PI / 4)) * kneeBendAmplitude * 0.8;
                rightForearmGroup.rotation.x = Math.max(0, Math.sin(time + Math.PI / 4)) * kneeBendAmplitude * 0.8;
            } else {
                // Reset limb rotations when not walking to a neutral pose
                leftLegGroup.rotation.x = 0;
                rightLegGroup.rotation.x = 0;
                leftArmGroup.rotation.x = 0;
                rightArmGroup.rotation.x = 0;
                leftLowerLegGroup.rotation.x = 0;
                rightLowerLegGroup.rotation.x = 0;
                leftForearmGroup.rotation.x = 0;
                rightForearmGroup.rotation.x = 0;
            }


            // --- State Machine Logic ---
            switch (gorillaState) {
                case 'walking':
                    // Movement
                    gorillaGroup.position.add(velocity.clone().multiplyScalar(speed));

                    // Boundary Collision
                    let reflected = false;
                    const normal = new THREE.Vector3();

                    if (gorillaGroup.position.x > worldBoundary || gorillaGroup.position.x < -worldBoundary) {
                        normal.set(gorillaGroup.position.x > 0 ? -1 : 1, 0, 0);
                        reflected = true;
                    }
                    if (gorillaGroup.position.z > worldBoundary || gorillaGroup.position.z < -worldBoundary) {
                        normal.set(0, 0, gorillaGroup.position.z > 0 ? -1 : 1);
                        reflected = true;
                    }

                    if (reflected) {
                        // Reflect the velocity
                        velocity.reflect(normal);
                        // Vary the angle slightly
                        const angleVariation = (Math.random() - 0.5) * Math.PI / 8; // +/- 22.5 degrees
                        velocity.applyAxisAngle(new THREE.Vector3(0, 1, 0), angleVariation);
                        velocity.normalize(); // Ensure velocity remains a unit vector
                    }
                    
                    // Make the gorilla look in the direction of its movement
                    gorillaGroup.lookAt(gorillaGroup.position.clone().sub(velocity));

                    // Check if walking duration is over
                    if (actionTimer >= walkDuration) {
                        gorillaState = 'mining';
                        actionTimer = 0;
                        velocity.set(0, 0, 0); // Stop movement
                    }
                    break;

                case 'mining':
                    // Gorilla is stationary during mining
                    // No movement or lookAt updates needed here

                    // Check if mining duration is over
                    if (actionTimer >= mineDuration) {
                        gorillaState = 'walking';
                        actionTimer = 0;
                        // Choose a new random direction for walking
                        velocity.set(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                    }
                    break;
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
