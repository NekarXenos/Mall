<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js Procedural Planetary Scene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display: block;
            color: white;
            font-family: monospace;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>

<body>
    <div id="info">Loading...</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

        window.addEventListener('load', () => {
            // --- Core Constants ---
            const SUN_RADIUS = 200;
            const WALK_SPEED = 5; // meters per second
            const RUN_SPEED = 12; // meters per second
            const BODY_HALF_HEIGHT = 1.5 / 2;

            // --- Swimming Constants ---
            const SWIM_SPEED = 3; // meters per second
            const SWIM_UP_SPEED = 2; // vertical speed in water
            const WATER_DRAG = 0.85; // velocity multiplier for water resistance
            const BUOYANCY = 2; // upward force in water

            // Prevent leaving a body without a jetpack
            const MAX_NO_JETPACK_ALTITUDE = 3.0; // meters above local ground

            // --- Rocket Constants ---
            const ROCKET_ENTER_DISTANCE = 10;
            const ROCKET_LENGTH = 10; // Rocket body length
            const ROCKET_MAIN_THRUST = 25.0;
            const ROCKET_BOOST_THRUST = 250.0;
            const ROCKET_TURN_SPEED = 2.5; // Yaw turning speed for A/D keys
            const ROCKET_RCS_THRUST = 15.0; // RCS strafe thrust for Q/E keys
            const ROCKET_BRAKE_FORCE = 0.95; // Brake multiplier (5% speed reduction per frame)
            const G_CONSTANT = 6000; // Gravitational constant, tweaked for gameplay
            // --- Launch Assist (auto-boost until clear of surface) ---
            const LAUNCH_ASSIST_TARGET_RADIAL_SPEED = 500; // m/s outward along XZ radial
            const LAUNCH_ASSIST_ACCEL = 2500; // m/s^2 additional outward acceleration
            const LAUNCH_ASSIST_GRACE_TIME = 1.0; // seconds to ignore collision after takeoff
            const LAUNCH_ASSIST_CLEARANCE = ROCKET_LENGTH * 2.5; // meters past surface before collisions resume
            // --- Launch tuning (user-tweakable) ---
            const LAUNCH_STRENGTH = 0.6; // Global multiplier to make launch stronger or weaker
            const LAUNCH_BASE_BODY_RADIUS = 100; // Reference body radius for scaling thrust with body size
            
            // --- Tractor Beam Constants ---
            const TRACTOR_BEAM_PULL_FORCE = 100.0; // Force pulling rocket toward target (increased for faster approach)
            const TRACTOR_BEAM_ROTATION_SYNC = 2.0; // Speed of rotation synchronization
            const TRACTOR_BEAM_MAX_DISTANCE = 2000; // Maximum effective range

            // --- Generation Settings ---
            const NUM_PLANETS = Math.floor(Math.random() * 4) + 5; // Generate 5 to 8 planets
            const PLANET_MIN_RADIUS = 50;
            const PLANET_MAX_RADIUS = 150;
            const MAX_MOONS_PER_PLANET = 4;
            const MOON_MIN_RADIUS_FACTOR = 0.1; // e.g., moon is at least 10% of planet size
            const MOON_MAX_RADIUS_FACTOR = 0.4; // e.g., moon is at most 40% of planet size

            // =================== SOLAR SYSTEM GENERATION ===================
            function generateSolarSystem() {
                const solarSystem = [];
                const outerPlanetStartIndex = Math.floor(NUM_PLANETS / 2);

                // 1. Generate random sizes and properties for planets, moons, and rings
                for (let i = 0; i < NUM_PLANETS; i++) {
                    const planetRadius = PLANET_MIN_RADIUS + Math.random() * (PLANET_MAX_RADIUS - PLANET_MIN_RADIUS);

                    const isGasGiant = i >= outerPlanetStartIndex && Math.random() < 0.9;
                    const effectiveRadius = isGasGiant ? planetRadius * 2 : planetRadius;

                    // --- Moons ---
                    const numMoons = Math.floor(Math.random() * (MAX_MOONS_PER_PLANET + 1));
                    const moons = [];
                    for (let j = 0; j < numMoons; j++) {
                        const moonMin = planetRadius * MOON_MIN_RADIUS_FACTOR;
                        const moonMax = planetRadius * MOON_MAX_RADIUS_FACTOR;
                        const moonRadius = moonMin + Math.random() * (moonMax - moonMin);
                        moons.push({
                            type: 'moon',
                            radius: moonRadius,
                            orbitRadius: 0,
                            orbitAngle: Math.random() * Math.PI * 2,
                            orbitSpeed: (0.2 + Math.random() * 0.8),
                            moonGroup: null,
                            mesh: null
                        });
                    }

                    // --- Rings ---
                    const rings = [];
                    const hasRings = (isGasGiant && Math.random() < 0.5) || (!isGasGiant && Math.random() < 0.05);
                    if (hasRings) {
                        const numRings = isGasGiant ? Math.floor(Math.random() * 3) + 1 : 1;
                        for (let j = 0; j < numRings; j++) {
                            rings.push({
                                type: 'ring',
                                innerRadius: 0,
                                outerRadius: 0,
                                // For rendering
                                mesh: null
                            });
                        }
                    }

                    solarSystem.push({
                        radius: planetRadius,
                        isGasGiant: isGasGiant,
                        effectiveRadius: effectiveRadius,
                        orbitRadius: 0,
                        moons: moons,
                        rings: rings,
                        orbiters: [], // Combined list for orbital calculations
                        ringSystemGroup: null, // For rotating the entire ring system
                        planetGroup: null,
                        mesh: null,
                        orbitAngle: Math.random() * Math.PI * 2,
                        orbitSpeed: (0.05 + Math.random() * 0.15)
                    });
                }

                // 2. Calculate orbits by alternating moons and rings
                solarSystem.forEach(planet => {
                    const localMoons = [...planet.moons];
                    const localRings = [...planet.rings];

                    // Create an alternating list of moons and rings
                    while (localMoons.length > 0 || localRings.length > 0) {
                        if (localRings.length > 0) {
                            planet.orbiters.push(localRings.shift());
                        }
                        if (localMoons.length > 0) {
                            planet.orbiters.push(localMoons.shift());
                        }
                    }

                    if (planet.orbiters.length === 0) return;

                    // Calculate positions sequentially
                    let lastOrbitEnd = planet.effectiveRadius + (planet.effectiveRadius * 0.4); // Start with a gap from the planet surface

                    for (let i = 0; i < planet.orbiters.length; i++) {
                        const orbiter = planet.orbiters[i];
                        const gap = planet.effectiveRadius * (0.2 + Math.random() * 0.2); // Random gap between orbiters

                        if (orbiter.type === 'ring') {
                            const ringWidth = planet.effectiveRadius * (0.3 + Math.random() * 0.5);
                            orbiter.innerRadius = lastOrbitEnd + gap;
                            orbiter.outerRadius = orbiter.innerRadius + ringWidth;
                            lastOrbitEnd = orbiter.outerRadius;
                        } else if (orbiter.type === 'moon') {
                            orbiter.orbitRadius = lastOrbitEnd + gap + orbiter.radius;
                            lastOrbitEnd = orbiter.orbitRadius + orbiter.radius;
                        }
                    }
                });


                // 3. Calculate planet orbits based on the specified rules
                const getOutermostDiameter = (body) => {
                    if (body.orbiters.length === 0) {
                        return body.effectiveRadius * 2;
                    }
                    const outermostObject = body.orbiters[body.orbiters.length - 1];
                    let outermostEdge = 0;
                    if (outermostObject.type === 'moon') {
                        outermostEdge = outermostObject.orbitRadius + outermostObject.radius;
                    } else { // It's a ring
                        outermostEdge = outermostObject.outerRadius;
                    }
                    return outermostEdge * 2;
                };

                if (solarSystem.length > 0) {
                    solarSystem[0].orbitRadius = (SUN_RADIUS * 2) + getOutermostDiameter(solarSystem[0]);

                    for (let i = 1; i < solarSystem.length; i++) {
                        const prevPlanet = solarSystem[i - 1];
                        const currentPlanet = solarSystem[i];
                        currentPlanet.orbitRadius = prevPlanet.orbitRadius + getOutermostDiameter(prevPlanet) + getOutermostDiameter(currentPlanet);
                    }
                }

                return solarSystem;
            }

            const solarSystemData = generateSolarSystem();

            // --- Utility function for Free Camera zoom calculation ---
            function getOrbitMaxDistance(planetData) {
                if (planetData.orbiters.length === 0) return planetData.effectiveRadius * 3;
                const outermost = planetData.orbiters[planetData.orbiters.length - 1];
                let distance = 0;
                if (outermost.type === 'moon') {
                    distance = outermost.orbitRadius + outermost.radius;
                } else { // It's a ring
                    distance = outermost.outerRadius;
                }
                return distance * 2;
            }

            // =================== THREE.JS SETUP ===================
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50000); // Increased far plane for larger systems
            const furthestPlanet = solarSystemData.length > 0 ? solarSystemData[solarSystemData.length - 1] : { orbitRadius: SUN_RADIUS * 4 };

            // --- Free Camera Zoom Logic ---
            let freeCameraZoomLevel = 0; // 0: Solar System, 1: Planetary System, 2: Surface
            let freeCameraZoomSmooth = 0; // Smooth interpolation value (0.0 to 2.999...)

            // Defines the camera offset/behaviour for each zoom level.
            const FREE_CAMERA_CONFIGS = [
                {
                    name: "Solar System",
                    isFixedY: true, // Camera maintains a fixed Y height globally
                    y: furthestPlanet.orbitRadius * 1.5, // Fixed height in scene
                    z: furthestPlanet.orbitRadius * 0.5 // Offset from character Z
                },
                {
                    name: "Planetary System",
                    isFixedY: false, // Camera maintains a height relative to the character
                    y: 1, // Placeholder, calculated in teleport()
                    z: 1  // Placeholder, calculated in teleport()
                },
                {
                    name: "Surface",
                    isFixedY: false,
                    y: 15,
                    z: 10
                }
            ];

            // Set initial camera position based on the Solar System config (Level 0)
            const initialConfig = FREE_CAMERA_CONFIGS[0];
            camera.position.set(0, initialConfig.y, initialConfig.z);
            camera.lookAt(0, 0, 0);

            let cameraMode = 'free';
            const thirdPersonCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50000);
            thirdPersonCamera.position.set(2, 0.3, -5);
            thirdPersonCamera.lookAt(0, 1.5, 0);
            const firstPersonCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50000);
            firstPersonCamera.position.set(0, 0, 0.5);
            firstPersonCamera.lookAt(0, 0, 1);

            let mouseLookEnabled = false;
            let mouseX = 0, mouseY = 0;
            let headPitch = 0;
            let bodyYaw = 0;
            const mouseSensitivity = 0.002;
            const maxPitch = Math.PI / 3;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            const sunLight = new THREE.PointLight(0xfffefd, 1000000);
            scene.add(sunLight);
            const ambientLight = new THREE.AmbientLight(0x555555, 0.5);
            scene.add(ambientLight);

            // =================== ROCKET STATE VARIABLES ===================
            let rocketObject = null;
            let rocketPivot = null; // Pivot for rocket when landed on a surface
            let isInRocket = false;
            const rocketVelocity = new THREE.Vector3();
            let rocketLaunchPlanet = null;
            let rocketPlume = null; // Visual indicator of rocket thrust
            let trajectoryLine = null; // Add trajectory line variable
            let rocketCameraZoomFactor = 1.0; // Zoom factor for camera distance in rocket mode
            // Maintain explicit yaw state so we can constrain to yaw-only rotation
            let rocketYaw = 0; // radians

            let trajUpdateTimer = 0; // Keep this for update throttling if desired
            
            // Launch assist state
            let launchAssistActive = false;
            let launchAssistBody = null; // THREE.Object3D (mesh) we're launching from
            let launchAssistBodyRadius = 0; // radius of that body
            let launchAssistGraceLeft = 0; // time left to ignore collisions
            let launchAssistElapsed = 0; // total time since assist start
            let launchAssistTargetRadialSpeed = 0; // computed per-launch from constants and body size
            let launchAssistAccelCurrent = 0; // computed per-launch from constants and body size
            let launchAssistBodyName = '';
            // Mesh of the body we launched from (to scope grace period correctly)
            let launchAssistBodyMesh = null;
            // Previous rocket world position for anti-tunneling collision checks
            let prevRocketWorldPos = null;
            
            // Tractor Beam State
            let tractorBeamActive = false;
            let tractorBeamTarget = null; // The mesh being targeted
            let tractorBeamTargetData = null; // The data for the target
            let tractorBeamHighlight = null; // Cyan circle highlight
            let tractorBeamLandingMode = false; // Whether in final landing phase

            // Debug mode variables
            let debugMode = false;
            let debugAxesGroup = null;

            // World-space helpers for rocket axes (account for parent transforms)
            function getRocketWorldQuat() {
                return rocketObject.getWorldQuaternion(new THREE.Quaternion());
            }
            function getRocketForwardWS() {
                return new THREE.Vector3(0, 1, 0).applyQuaternion(getRocketWorldQuat()).normalize();
            }
            function getRocketRightWS() {
                return new THREE.Vector3(1, 0, 0).applyQuaternion(getRocketWorldQuat()).normalize();
            }
            function getRocketLeftWS() {
                return new THREE.Vector3(-1, 0, 0).applyQuaternion(getRocketWorldQuat()).normalize();
            }

            // =================== BUILD SCENE FROM GENERATED DATA ===================
            const sunGeometry = new THREE.IcosahedronGeometry(SUN_RADIUS, 2);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffdd33, wireframe: false });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sun);

            const teleportLocations = [];
            const colorPalette = [0x88ff22, 0xff8822, 0x99ff99, 0xff9999, 0x9999ff, 0xffff99, 0x99ffff, 0xff99ff];

            solarSystemData.forEach((planetData, pIndex) => {
                const planetSystemLocations = [];

                const planetGroup = new THREE.Object3D();
                planetData.planetGroup = planetGroup;
                scene.add(planetGroup);

                const planetGeometry = new THREE.IcosahedronGeometry(planetData.radius, 1);
                const planetMaterial = new THREE.MeshStandardMaterial({ color: colorPalette[pIndex % colorPalette.length], roughness: 0.8 });
                const planet = new THREE.Mesh(planetGeometry, planetMaterial);
                planetData.mesh = planet;
                planetGroup.add(planet);

                // --- Add special features to the first planet ---
                if (pIndex === 0) {
                    // --- Ocean ---
                    const oceanRadius = planetData.radius * 0.96;
                    const oceanGeometry = new THREE.SphereGeometry(oceanRadius, 32, 32);
                    const oceanMaterial = new THREE.MeshStandardMaterial({
                        color: 0x3399ff,
                        transparent: true,
                        opacity: 0.6,
                        roughness: 0.3,
                        metalness: 0.7
                    });
                    const oceanSphere = new THREE.Mesh(oceanGeometry, oceanMaterial);
                    planetGroup.add(oceanSphere);

                    planetData.waterSphere = oceanSphere;
                    planetData.waterRadius = oceanRadius;

                    // --- Atmosphere ---
                    let atmosphereRadius;
                    if (planetData.moons.length === 0) {
                        // No moons: fixed atmosphere radius
                        atmosphereRadius = oceanRadius + 16;
                    } else {
                        // Has moons: calculate based on closest moon
                        let closestMoonOrbit = Infinity;
                        let closestMoonRadius = 0;
                        planetData.moons.forEach(moonData => {
                            if (moonData.orbitRadius < closestMoonOrbit) {
                                closestMoonOrbit = moonData.orbitRadius;
                                closestMoonRadius = moonData.radius;
                            }
                        });
                        atmosphereRadius = oceanRadius + (closestMoonOrbit - closestMoonRadius - oceanRadius) / 3;
                    }

                    const atmosphereGeometry = new THREE.SphereGeometry(atmosphereRadius, 32, 32);
                    const atmosphereMaterial = new THREE.MeshStandardMaterial({
                        color: 0x88ccff,
                        transparent: true,
                        opacity: 0.15,
                        side: THREE.BackSide, // Render from inside
                        depthWrite: false
                    });
                    const atmosphereSphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
                    planetGroup.add(atmosphereSphere);

                    planetData.atmosphereSphere = atmosphereSphere;
                    planetData.atmosphereRadius = atmosphereRadius;

                    // --- Rocket ---
                    const rocket = new THREE.Group();

                    const rocketBodyGeometry = new THREE.SphereGeometry(1.5, 16, 16);
                    const rocketBodyMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.7, roughness: 0.3 });
                    const rocketBody = new THREE.Mesh(rocketBodyGeometry, rocketBodyMaterial);
                    rocketBody.scale.y = 10 / 3;
                    // Position rocket body forward along local Y-axis (which will be on X-Z plane after rotation)
                    rocketBody.position.y = 5;
                    rocket.add(rocketBody);

                    const finGeometry = new THREE.TetrahedronGeometry(1);
                    const finMaterial = new THREE.MeshStandardMaterial({ color: 0xee4444, metalness: 0.4, roughness: 0.6 });
                    for (let i = 0; i < 3; i++) {
                        const fin = new THREE.Mesh(finGeometry, finMaterial);
                        fin.scale.set(0.1, 3, 2.0);
                        const angle = (i / 3) * Math.PI * 2;
                        const radiusFromCenter = 1;
                        
                        fin.position.set(Math.sin(angle) * radiusFromCenter, 1.5, Math.cos(angle) * radiusFromCenter);
                        fin.rotation.y = angle;
                        //fin.rotation.x = -Math.PI / 8;
                        rocket.add(fin);
                    }

                    // --- Rocket Plume (thrust visualization) ---
                    const plumeGeometry = new THREE.ConeGeometry(1.2, 1, 8, 1, true);
                    const plumeMaterial = new THREE.MeshBasicMaterial({
                        color: 0xff6600,
                        transparent: true,
                        opacity: 0.8,
                        side: THREE.DoubleSide
                    });
                    const plume = new THREE.Mesh(plumeGeometry, plumeMaterial);
                    plume.position.y = 0; // At the base of the rocket
                    plume.rotation.x = Math.PI; // Point downward
                    plume.visible = false; // Initially hidden
                    rocket.add(plume);
                    rocketPlume = plume; // Store global reference

                    // Create rocket pivot for surface landing
                    const pivot = new THREE.Object3D();
                    pivot.add(rocket);
                    
                    // Add pivot to scene (when flying free)
                    scene.add(pivot);

                    // Calculate initial world position for the rocket at the planet's current orbital position
                    const planetWorldPos = new THREE.Vector3(
                        planetData.orbitRadius * Math.cos(planetData.orbitAngle),
                        0,
                        planetData.orbitRadius * Math.sin(planetData.orbitAngle)
                    );

                    // Place the pivot just off the planet surface along the radial (sun -> planet) direction
                    const radial = planetWorldPos.clone().normalize();
                    const spawnOffset = planetData.effectiveRadius + 5; // small clearance above surface
                    pivot.position.copy(planetWorldPos).add(radial.multiplyScalar(spawnOffset));

                    // Rotate rocket to lie on X-Z plane with Z-axis pointing up (parallel to world +Y)
                    rocket.rotation.x = -Math.PI / 2; // Tip rocket onto the X-Z plane (Z -> +Y)
                    rocketYaw = 0;

                    // Store global references for rocket control
                    rocketObject = rocket;
                    rocketPivot = pivot;
                    rocketLaunchPlanet = planetGroup;

                    // --- Direction Arrow (always visible, in orbital plane) ---
                    (function createDirectionArrow() {
                        const arrowGroup = new THREE.Group();

                        // Create an upside-down V (chevron ^) shape like in PlanetJump16
                        const arrowShape = new THREE.Shape();
                        arrowShape.moveTo(0, 0.4);      // Tip of the arrow
                        arrowShape.lineTo(0.25, 0);     // Bottom-right point
                        arrowShape.lineTo(0, 0.15);     // Indent in the middle of the base
                        arrowShape.lineTo(-0.25, 0);    // Bottom-left point
                        arrowShape.closePath();         // Connects back to the tip
                        const points = arrowShape.getPoints();
                        const arrowGeo = new THREE.BufferGeometry().setFromPoints(points);
                        const arrowMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 5, side: THREE.DoubleSide });


                        const arrowMesh = new THREE.Line(arrowGeo, arrowMat); // THREE.Mesh(arrowGeo, arrowMat);
                        arrowMesh.rotation.x = -Math.PI / 2; // Rotate to face upward in the rocket's frame
                        arrowMesh.position.y = 15;           // Position above the rocket
                        arrowMesh.scale.set(5, 5, 5);        // Initial scale (will be dynamically adjusted)
                        arrowMesh.renderOrder = 10000;       // Draw on top

                        arrowGroup.add(arrowMesh);

                        // Keep strictly in orbital plane with Y=0
                        arrowGroup.position.set(0, 0, 0);
                        arrowGroup.rotation.set(Math.PI / 2, 0, 0); // Align with orbital plane
                        arrowGroup.renderOrder = 10000;

                        rocket.add(arrowGroup);
                        rocket.directionArrow = arrowGroup;
                        arrowGroup.arrowMesh = arrowMesh; // Store reference to the mesh for scaling
                    })();

                    // --- Debug Axes (X=Red, Y=Green, Z=Blue) ---
                    (function createDebugAxes() {
                        debugAxesGroup = new THREE.Group();

                        const axisLength = 50;
                        const axisRadius = 0.3;

                        // X-axis (Red)
                        const xAxisGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
                        const xAxisMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                        const xAxis = new THREE.Mesh(xAxisGeometry, xAxisMaterial);
                        xAxis.rotation.z = -Math.PI / 2; // Rotate to align with X axis
                        xAxis.position.x = axisLength / 2;
                        debugAxesGroup.add(xAxis);

                        // Y-axis (Green)
                        const yAxisGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
                        const yAxisMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                        const yAxis = new THREE.Mesh(yAxisGeometry, yAxisMaterial);
                        yAxis.position.y = axisLength / 2;
                        debugAxesGroup.add(yAxis);

                        // Z-axis (Blue)
                        const zAxisGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength, 8);
                        const zAxisMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
                        const zAxis = new THREE.Mesh(zAxisGeometry, zAxisMaterial);
                        zAxis.rotation.x = Math.PI / 2; // Rotate to align with Z axis
                        zAxis.position.z = axisLength / 2;
                        debugAxesGroup.add(zAxis);

                        // Use active camera to calculate distance
                        let activeCamera = camera;
                        const AXES_SCALE_FACTOR = 0.001; // Adjust this factor to change scaling sensitivity
                        const rocketWorldPosition = new THREE.Vector3();
                        rocket.getWorldPosition(rocketWorldPosition);
                        const distance = activeCamera.position.distanceTo(rocketWorldPosition);
                        let newScale = distance * AXES_SCALE_FACTOR;

                        // Minimum scale to ensure the axes are always visible
                        newScale = Math.max(newScale, 3.0);

                        // Apply scale to the axes mesh
                        debugAxesGroup.scale.set(newScale, newScale, newScale);


                        // debugAxesGroup.scale.set(2, 2, 2); // ARROW_SCALE_FACTOR Scale down the axes for better visibility

                        debugAxesGroup.visible = false; // Initially hidden
                        rocket.add(debugAxesGroup);
                    })();
                }

                if (planetData.isGasGiant) {
                    const gasGeometry = new THREE.SphereGeometry(planetData.effectiveRadius, 32);
                    const gasMaterial = new THREE.MeshStandardMaterial({
                        color: colorPalette[pIndex % colorPalette.length],
                        transparent: true,
                        opacity: 0.35,
                        roughness: 0.2
                    });
                    const gasSphere = new THREE.Mesh(gasGeometry, gasMaterial);
                    planetGroup.add(gasSphere);

                    const liquidRadius = (planetData.radius + planetData.effectiveRadius) / 2;
                    const liquidGeometry = new THREE.SphereGeometry(liquidRadius, 32, 32);
                    const liquidMaterial = new THREE.MeshStandardMaterial({
                        color: 0x4466aa,
                        transparent: true,
                        opacity: 0.5,
                        roughness: 0.4,
                        metalness: 0.6
                    });
                    const liquidSphere = new THREE.Mesh(liquidGeometry, liquidMaterial);
                    planetGroup.add(liquidSphere);

                    planetData.liquidSphere = liquidSphere;
                    planetData.liquidRadius = liquidRadius;
                }
                
                // Store planet name
                planetData.name = `Planet ${pIndex + 1}`;

                planetSystemLocations.push({ name: `Planet ${pIndex + 1}`, object: planet, parentGroup: planetGroup, radius: planetData.effectiveRadius });

                // --- Build Rings ---
                if (planetData.rings.length > 0) {
                    const ringSystemGroup = new THREE.Object3D();
                    planetData.ringSystemGroup = ringSystemGroup;
                    planetGroup.add(ringSystemGroup);
                    ringSystemGroup.rotation.x = Math.PI / 2;
                    planetData.rings.forEach(ringData => {
                        const ringGeometry = new THREE.RingGeometry(ringData.innerRadius, ringData.outerRadius, 64);
                        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide, transparent: true, opacity: 0.4 + Math.random() * 0.2 });
                        const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
                        ringSystemGroup.add(ringMesh);
                        ringData.mesh = ringMesh;
                    });
                }

                // --- Build Moons ---
                planetData.moons.forEach((moonData, mIndex) => {
                    const moonGroup = new THREE.Object3D();
                    moonGroup.position.set(moonData.orbitRadius, 0, 0);
                    planetData.planetGroup.add(moonGroup);
                    moonData.moonGroup = moonGroup;
                    moonData.isMoon = true; // Mark as moon for collision detection
                    const moonGeometry = new THREE.IcosahedronGeometry(moonData.radius, 0);

                if (a === 0) return f.length() <= radius; // no movement
                const b = 2 * f.dot(d);
                const c = f.dot(f) - radius * radius;
                const disc = b * b - 4 * a * c;
                if (disc < 0) return false;
                const s = Math.sqrt(disc);
                const t1 = (-b - s) / (2 * a);

                return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1);

                        if (dist < sphereOfInfluence) {

                        if (dist < closestDistAtStep) {

                    const celestialBodies = [...solarSystemData, { mesh: sun, radius: SUN_RADIUS }];

                    planetsEncountered.forEach(planetData => {
