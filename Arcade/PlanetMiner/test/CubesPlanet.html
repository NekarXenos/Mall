<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Miner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #1a1a2e; color: #e0e0e0; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #message-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="message-box">Click or tap the planet to mine blocks!</div>
    <script>
        // Set up basic Three.js scene components
        let scene, camera, renderer, raycaster;
        const pointer = new THREE.Vector2(); // Stores mouse/touch coordinates
        let planetBlocks = []; // Stores all active block meshes for raycasting
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let rotationSpeed = 0.005;

        // Voxel grid properties
        const GRID_SIZE = 10; // Diameter of the planet in blocks
        const BLOCK_SIZE = 1; // Size of each individual block
        const PLANET_RADIUS = GRID_SIZE / 2 * BLOCK_SIZE; // Radius of the sphere in world units

        // A 3D array to represent the voxel data (0 = empty, 1 = solid)
        let voxelData = [];
        // A map to store references to the actual THREE.Mesh objects, keyed by their grid coordinates
        let voxelMeshesMap = new Map(); // Key: `${x},${y},${z}`, Value: THREE.Mesh

        /**
         * Initializes the Three.js scene, camera, renderer, and lighting.
         * Sets up event listeners for user interaction and window resizing.
         */
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x282c34); // Dark background

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, PLANET_RADIUS * 2.5); // Position camera away from the planet
            camera.lookAt(0, 0, 0); // Look at the center of the scene

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5); // Stronger directional light
            directionalLight.position.set(5, 5, 5).normalize();
            scene.add(directionalLight);

            // Raycaster for mining
            raycaster = new THREE.Raycaster();

            // Generate the initial planet
            generatePlanet();

            // Event Listeners for interaction
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            renderer.domElement.addEventListener('pointerleave', onPointerUp); // End drag if mouse leaves canvas
            window.addEventListener('resize', onWindowResize);
        }

        /**
         * Generates the spherical planet using individual voxel blocks.
         * Fills the `voxelData` array and creates `THREE.Mesh` objects for solid voxels.
         */
        function generatePlanet() {
            const halfGrid = GRID_SIZE / 2;
            const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            const blockMaterial = new THREE.MeshStandardMaterial({ color: 0x5a2d0a }); // Earthy brown color

            // Initialize voxelData and create meshes
            for (let x = 0; x < GRID_SIZE; x++) {
                voxelData[x] = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    voxelData[x][y] = [];
                    for (let z = 0; z < GRID_SIZE; z++) {
                        // Calculate distance from the center of the grid
                        const dist = Math.sqrt(
                            Math.pow(x - halfGrid + 0.5, 2) + // +0.5 to center the block in its grid cell
                            Math.pow(y - halfGrid + 0.5, 2) +
                            Math.pow(z - halfGrid + 0.5, 2)
                        );

                        // If within radius, it's a solid block
                        if (dist <= PLANET_RADIUS / BLOCK_SIZE) {
                            voxelData[x][y][z] = 1; // Solid
                            const block = new THREE.Mesh(blockGeometry, blockMaterial);
                            // Position the block correctly based on its grid coordinates
                            block.position.set(
                                (x - halfGrid + 0.5) * BLOCK_SIZE,
                                (y - halfGrid + 0.5) * BLOCK_SIZE,
                                (z - halfGrid + 0.5) * BLOCK_SIZE
                            );
                            block.userData = { gridX: x, gridY: y, gridZ: z }; // Store grid coords for mining
                            scene.add(block);
                            planetBlocks.push(block); // Add to the array for raycasting
                            voxelMeshesMap.set(`${x},${y},${z}`, block); // Store in map for quick lookup
                        } else {
                            voxelData[x][y][z] = 0; // Empty
                        }
                    }
                }
            }
        }

        /**
         * Handles pointer down events for both mining and camera rotation.
         * @param {PointerEvent} event - The pointerdown event.
         */
        function onPointerDown(event) {
            isDragging = true;
            previousMouseX = event.clientX;
            previousMouseY = event.clientY;

            // Only attempt to mine on left click or single touch
            if (event.button === 0 || event.pointerType === 'touch') {
                // Calculate pointer position in normalized device coordinates (-1 to +1)
                pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
                pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

                // Update the raycaster with the camera and pointer position
                raycaster.setFromCamera(pointer, camera);

                // Check for intersections with planet blocks
                const intersects = raycaster.intersectObjects(planetBlocks);

                if (intersects.length > 0) {
                    const intersectedObject = intersects[0].object;
                    mineBlock(intersectedObject);
                }
            }
        }

        /**
         * Handles pointer move events for camera rotation.
         * @param {PointerEvent} event - The pointermove event.
         */
        function onPointerMove(event) {
            if (!isDragging) return;

            const deltaX = event.clientX - previousMouseX;
            const deltaY = event.clientY - previousMouseY;

            // Rotate the camera around the central point (0,0,0)
            const axisX = new THREE.Vector3(0, 1, 0); // Y-axis for horizontal rotation
            const axisY = new THREE.Vector3(1, 0, 0); // X-axis for vertical rotation

            camera.position.applyAxisAngle(axisX, -deltaX * rotationSpeed);
            camera.position.applyAxisAngle(axisY, -deltaY * rotationSpeed);
            camera.lookAt(0, 0, 0); // Always look at the center of the planet

            previousMouseX = event.clientX;
            previousMouseY = event.clientY;
        }

        /**
         * Handles pointer up events to stop camera rotation.
         * @param {PointerEvent} event - The pointerup event.
         */
        function onPointerUp(event) {
            isDragging = false;
        }

        /**
         * Mines a specific block, removing it from the scene and updating voxel data.
         * @param {THREE.Mesh} blockMesh - The block mesh to be removed.
         */
        function mineBlock(blockMesh) {
            // Get grid coordinates from userData
            const { gridX, gridY, gridZ } = blockMesh.userData;

            // Remove from scene
            scene.remove(blockMesh);

            // Update voxel data
            voxelData[gridX][gridY][gridZ] = 0; // Set to empty

            // Remove from planetBlocks array to prevent further raycasting on it
            const index = planetBlocks.indexOf(blockMesh);
            if (index > -1) {
                planetBlocks.splice(index, 1);
            }

            // Remove from the map
            voxelMeshesMap.delete(`${gridX},${gridY},${gridZ}`);

            // Optional: Add a simple particle effect (for visual feedback)
            createMiningEffect(blockMesh.position);
        }

        /**
         * Creates a small visual effect at the mining location.
         * @param {THREE.Vector3} position - The world position where mining occurred.
         */
        function createMiningEffect(position) {
            const particleCount = 10;
            const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffa500 }); // Orange/yellow color for dust/sparks

            for (let i = 0; i < particleCount; i++) {
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(position);

                // Give random velocity
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                );
                particle.decay = 0.02; // How fast the particle fades/shrinks

                scene.add(particle);

                // Animate particle removal after a short time
                let opacity = 1;
                const interval = setInterval(() => {
                    if (opacity <= 0) {
                        scene.remove(particle);
                        clearInterval(interval);
                    } else {
                        particle.position.add(particle.velocity);
                        particle.material.opacity = opacity;
                        particle.material.transparent = true;
                        particle.scale.multiplyScalar(0.95); // Shrink
                        opacity -= particle.decay;
                    }
                }, 50);
            }
        }

        /**
         * Handles window resizing to maintain responsiveness.
         */
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * The main animation loop for rendering the scene.
         */
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Initialize the game when the window loads
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
