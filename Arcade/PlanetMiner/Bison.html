<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Animatable Bison</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        .info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="info">Animatable Three.js Bison | Drag to rotate, Scroll to zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5); // Position camera to view the bison

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // Enable shadows
        document.body.appendChild(renderer.domElement);

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // an animation loop is required when either damping or auto-rotate are enabled
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 2;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2; // Prevent camera from going below the ground

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(-5, 10, 7.5);
        directionalLight.castShadow = true;
        // Configure shadow properties
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        scene.add(directionalLight);

        // --- GROUND ---
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x556B2F }); // Dark olive green
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- BISON MODEL ---
        // Create a group to hold all parts of the bison
        const bison = new THREE.Group();
        scene.add(bison);
        bison.position.y = 1.3; // Raise the bison to stand on the ground

        // Materials
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.8 }); // Dark brown
        const maneMaterial = new THREE.MeshStandardMaterial({ color: 0x3D2B1F, roughness: 0.9 }); // Very dark brown
        const hoofMaterial = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.5 }); // Near black
        const hornMaterial = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 0.6 }); // Tan

        // --- BISON PARTS (1 unit = 1 meter) ---

        // Body (Stretched Dodecahedron)
        // A bison is roughly 2.5-3m long, 1.5-1.8m tall at the shoulder
        const bodyGeometry = new THREE.DodecahedronGeometry(1, 0);
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.scale.set(0.8, 0.9, 1.5); // width, height, length
        body.castShadow = true;
        bison.add(body);

        // Head (Stretched Dodecahedron)
        const headGeometry = new THREE.DodecahedronGeometry(0.6, 0);
        const head = new THREE.Mesh(headGeometry, maneMaterial); // Head is also furry
        head.position.set(0, 0.3, -1.8);
        head.scale.set(0.8, 1, 0.9);
        head.castShadow = true;
        bison.add(head);

        // Mane / Hump (Stretched Dodecahedron)
        const maneGeometry = new THREE.DodecahedronGeometry(1, 0);
        const mane = new THREE.Mesh(maneGeometry, maneMaterial);
        mane.position.set(0, 0.4, -0.5);
        mane.scale.set(1.0, 1.1, 1.0);
        mane.castShadow = true;
        bison.add(mane);

        // Ears (Stretched Dodecahedrons)
        const earGeometry = new THREE.DodecahedronGeometry(0.15, 0);
        const leftEar = new THREE.Mesh(earGeometry, maneMaterial);
        leftEar.position.set(-0.5, 0.8, -1.6);
        leftEar.scale.set(1, 1, 0.4); // Flatten the ear
        leftEar.rotation.z = Math.PI / 4;
        bison.add(leftEar);

        const rightEar = leftEar.clone();
        rightEar.position.x = 0.5;
        rightEar.rotation.z = -Math.PI / 4;
        bison.add(rightEar);
        
        // Horns (Bent Cylinders)
        const hornCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0.2, 0.2, 0),
            new THREE.Vector3(0.4, 0.1, 0),
        ]);
        const hornGeometry = new THREE.TubeGeometry(hornCurve, 20, 0.05, 8, false);
        const leftHorn = new THREE.Mesh(hornGeometry, hornMaterial);
        leftHorn.position.set(-0.3, 0.9, -1.9);
        leftHorn.rotation.y = -Math.PI / 6;
        bison.add(leftHorn);

        const rightHorn = new THREE.Mesh(hornGeometry, hornMaterial);
        rightHorn.position.set(0.3, 0.9, -1.9);
        rightHorn.rotation.y = Math.PI + Math.PI / 6; // Flip it
        bison.add(rightHorn);


        // Thighs / Shoulders (Stretched Dodecahedrons)
        const legUpperGeometry = new THREE.DodecahedronGeometry(0.4, 0);

        // Front Left Shoulder
        const frontLeftShoulder = new THREE.Mesh(legUpperGeometry, bodyMaterial);
        frontLeftShoulder.position.set(-0.6, -0.4, -0.8);
        frontLeftShoulder.scale.set(1, 1.2, 1);
        frontLeftShoulder.castShadow = true;
        bison.add(frontLeftShoulder);

        // Front Right Shoulder
        const frontRightShoulder = frontLeftShoulder.clone();
        frontRightShoulder.position.x = 0.6;
        bison.add(frontRightShoulder);

        // Back Left Thigh
        const backLeftThigh = new THREE.Mesh(legUpperGeometry, bodyMaterial);
        backLeftThigh.position.set(-0.5, -0.5, 1.0);
        backLeftThigh.scale.set(1, 1.3, 1);
        backLeftThigh.castShadow = true;
        bison.add(backLeftThigh);

        // Back Right Thigh
        const backRightThigh = backLeftThigh.clone();
        backRightThigh.position.x = 0.5;
        bison.add(backRightThigh);

        // Lower Legs / Hoofs (Cylinders)
        const legLowerGeometry = new THREE.CylinderGeometry(0.1, 0.12, 0.8, 8); // Tapered slightly for hoof

        // Front Left Leg
        const frontLeftLeg = new THREE.Mesh(legLowerGeometry, hoofMaterial);
        frontLeftLeg.position.set(-0.6, -1.2, -0.8);
        frontLeftLeg.castShadow = true;
        bison.add(frontLeftLeg);

        // Front Right Leg
        const frontRightLeg = frontLeftLeg.clone();
        frontRightLeg.position.x = 0.6;
        bison.add(frontRightLeg);

        // Back Left Leg
        const backLeftLeg = frontLeftLeg.clone();
        backLeftLeg.position.set(-0.5, -1.3, 1.0);
        bison.add(backLeftLeg);

        // Back Right Leg
        const backRightLeg = backLeftLeg.clone();
        backRightLeg.position.x = 0.5;
        bison.add(backRightLeg);

        // Tail (Cylinder)
        const tailGeometry = new THREE.CylinderGeometry(0.05, 0.03, 0.9, 6);
        const tail = new THREE.Mesh(tailGeometry, maneMaterial);
        tail.position.set(0, -0.3, 1.5);
        tail.rotation.x = Math.PI / 6; // Angle it down
        tail.castShadow = true;
        bison.add(tail);

        // --- ANIMATION ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Animate the tail
            tail.rotation.y = Math.sin(elapsedTime * 3) * 0.5; // Sway side to side

            controls.update(); // only required if controls.enableDamping = true, or if controls.autoRotate = true
            renderer.render(scene, camera);
        }

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the animation loop
        animate();

    </script>
</body>
</html>
