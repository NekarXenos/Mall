<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Planet Miner - Atmosphere & Clouds</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <!-- Include Simplex Noise library for terrain generation -->
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FWN6NL8B16"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FWN6NL8B16');

<body>
    <div style="position: absolute; top: 10px; left: 10px; z-index: 999;">
        <a href="../Arcade.html"
            style="color: white; text-decoration: none; background-color: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;">Back
            to Arcade</a>
    </div>

    <!-- New Inventory Bar -->
    <div id="inventory-bar">
        <div id="inventory-slots">
            <!-- Slots will be generated by JS -->
        </div>
    </div>

    <div id="health-bar-container">
        <div id="health-bar-fill" style="width:100%;"></div>
        <span id="health-bar-text">100 / 100</span>
    </div>

    <div id="damage-overlay"></div>

    <div id="message-box">Click or tap to play!</div>
    <div id="overlay">Click to start</div>
    <div id="crosshair"></div>

    <div id="mobile-controls">
        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>
        <div id="action-buttons-area">
            <button id="mine-button" class="action-button">MINE</button>
            <button id="build-button" class="action-button">BUILD</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
