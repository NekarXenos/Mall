<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Planet Formula Designer</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono&display=swap"
        rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #e5e7eb;
            display: flex;
        }

        #container {
            position: relative;
            flex-grow: 1;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            width: 350px;
            min-width: 300px;
            flex-shrink: 0;
            height: 100%;
            background-color: #1f2937;
            border-left: 1px solid #374151;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 1.25em;
            color: #9ca3af;
            border-bottom: 1px solid #374151;
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1.0em;
            color: #9ca3af;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h4 {
            font-size: 0.9em;
            color: #9ca3af;
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            margin-bottom: 8px;
            color: #d1d5db;
        }

        .value-input {
            font-family: 'Roboto Mono', monospace;
            background-color: #374151;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            width: 70px;
            text-align: right;
        }

        /* Hide spinner buttons on number inputs */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .checkbox-group label {
            font-size: 0.9em;
            margin-left: 8px;
            cursor: pointer;
        }

        #formula-container {
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            flex-grow: 1;
        }

        #formula {
            width: 100%;
            box-sizing: border-box;
            background-color: #111827;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Roboto Mono', monospace;
            resize: vertical;
            flex-grow: 1;
            min-height: 150px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        #reset-button,
        .random-button,
        #export-settings-button,
        #load-settings-button,
        #add-color-button {
            background-color: #4b5563;
        }

        #reset-button:hover,
        .random-button:hover,
        #export-settings-button:hover,
        #load-settings-button:hover,
        #add-color-button:hover {
            background-color: #6b7280;
        }

        .seed-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .seed-input {
            flex-grow: 1;
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #e5e7eb;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
        }

        .random-button {
            flex-shrink: 0;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            z-index: 10;
        }

        /* Gradient Editor Styles */
        #gradient-preview-container {
            position: relative;
        }

        #gradient-preview {
            width: 100%;
            height: 30px;
            border-radius: 4px;
            border: 1px solid #4b5563;
            margin-bottom: 10px;
        }

        #water-level-marker {
            position: absolute;
            top: -2px;
            bottom: -2px;
            width: 3px;
            background-color: #f3f4f6;
            border-radius: 2px;
            border: 1px solid #4b5563;
            transform: translateX(-50%);
            pointer-events: none;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .color-stop {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .color-stop input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            background-color: transparent;
        }

        .color-stop input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-stop input[type="color"]::-webkit-color-swatch {
            border: 1px solid #4b5563;
            border-radius: 4px;
        }

        .color-stop input[type="range"] {
            flex-grow: 1;
            margin: 0 10px;
        }

        .color-stop-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9em;
            width: 40px;
            text-align: right;
        }

        .remove-color-button {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.2em;
            padding: 5px;
        }

        .remove-color-button:hover {
            color: #ef4444;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }

            #controls {
                width: 100%;
                height: 50vh;
                flex-shrink: 0;
                border-left: none;
                border-top: 1px solid #374151;
            }

            #container {
                height: 50vh;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading-overlay">Generating Planet...</div>
        <canvas id="c"></canvas>
    </div>
    <div id="controls">
        <h2>Planet Designer</h2>
        <h3>Generation Seed</h3>
        <div class="control-group">
            <label for="seed"><span>Seed Value</span></label>
            <div class="seed-input-group">
                <input type="text" id="seed" class="seed-input">
                <button id="random-seed-button" class="random-button" title="Generate Random Seed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 16 16" style="pointer-events: none;">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                        <path
                            d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                    </svg>
                </button>
            </div>
        </div>
        <h3>Terrain Shape</h3>
        <div class="control-group">
            <label for="scale">
                <span>Scale</span>
                <input type="number" class="value-input" id="scale-value" min="0.001" max="0.1" step="0.001"
                    value="0.02">
            </label>
            <input type="range" id="scale" min="0.001" max="0.1" step="0.001" value="0.02">
        </div>
        <div class="control-group">
            <label for="strength">
                <span>Strength</span>
                <input type="number" class="value-input" id="strength-value" min="0" max="2" step="0.01" value="1.0">
            </label>
            <input type="range" id="strength" min="0" max="2" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label for="terrain-transparency">
                <span>Terrain Transparency</span>
                <input type="number" class="value-input" id="terrain-transparency-value" min="0" max="1" step="0.01" value="0">
            </label>
            <input type="range" id="terrain-transparency" min="0" max="1" step="0.01" value="0">
        </div>
        <h3>Fractal Settings</h3>
        <div class="checkbox-group">
            <input type="checkbox" id="use-fractal" checked>
            <label for="use-fractal">Use Fractal Noise</label>
        </div>
        <div class="control-group">
            <label for="levels">
                <span>Fractal Levels</span>
                <input type="number" class="value-input" id="levels-value" min="1" max="10" step="1" value="6">
            </label>
            <input type="range" id="levels" min="1" max="10" step="1" value="6">
        </div>
        <div class="control-group">
            <label for="lacunarity">
                <span>Lacunarity</span>
                <input type="number" class="value-input" id="lacunarity-value" min="1.0" max="4.0" step="0.05"
                    value="2.0">
            </label>
            <input type="range" id="lacunarity" min="1.0" max="4.0" step="0.05" value="2.0">
        </div>
        <div class="control-group">
            <label for="persistence">
                <span>Persistence (Gain)</span>
                <input type="number" class="value-input" id="persistence-value" min="0.1" max="1.0" step="0.01"
                    value="0.5">
            </label>
            <input type="range" id="persistence" min="0.1" max="1.0" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label for="ridged-blend">
                <span>Ridged Blend</span>
                <input type="number" class="value-input" id="ridged-blend-value" min="0" max="1" step="0.01" value="0">
            </label>
            <input type="range" id="ridged-blend" min="0" max="1" step="0.01" value="0">
        </div>
        <h3>Water & Beach Settings</h3>
        <div class="control-group">
            <label for="water-level">
                <span>Water Level</span>
                <input type="number" class="value-input" id="water-level-value" min="0.1" max="1.0" step="0.01"
                    value="0.7">
            </label>
            <input type="range" id="water-level" min="0.1" max="1.0" step="0.01" value="0.7">
        </div>
        <div class="control-group">
            <label for="beach-width">
                <span>Beach Width</span>
                <input type="number" class="value-input" id="beach-width-value" min="0" max="2" step="0.01" value="0">
            </label>
            <input type="range" id="beach-width" min="0" max="2" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label for="water-transparency">
                <span>Transparency</span>
                <input type="number" class="value-input" id="water-transparency-value" min="0" max="1" step="0.01"
                    value="0.35">
            </label>
            <input type="range" id="water-transparency" min="0" max="1" step="0.01" value="0.35">
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="show-water" checked>
            <label for="show-water">Show Water</label>
        </div>
        <h3>Planet Type</h3>
        <div class="checkbox-group">
            <input type="checkbox" id="rocky-planet">
            <label for="rocky-planet">Rocky Planet Mode</label>
        </div>
        <div class="control-group" id="soil-color-group">
            <label for="soil-color">
                <span>Base Soil Color</span>
            </label>
            <input type="color" id="soil-color" value="#C1440E" style="width: 100%; height: 40px; cursor: pointer;">
        </div>
        <h3>Water Color</h3>
        <div id="gradient-preview-container">
            <div id="gradient-preview"></div>
            <div id="water-level-marker"></div>
        </div>
        <div id="shoreline-color-stop-container"></div>
        <h4>Depth Colors</h4>
        <div id="color-stops-container"></div>
        <div class="button-group">
            <button id="add-color-button">Add Color</button>
        </div>
        <h3>Settings Management</h3>
        <div class="button-group">
            <button id="export-settings-button">Export</button>
            <button id="load-settings-button">Load</button>
        </div>
        <input type="file" id="load-settings-input" style="display: none;" accept=".json">
        <div id="formula-container">
            <h3>Final Formula</h3>
            <label for="formula" style="margin-bottom: 6px; color: #d1d5db; font-size: 0.95em;">Formula Editor</label>
            <textarea id="formula" title="Enter the planet generation formula here"
                placeholder="Enter formula for terrain generation"></textarea>
            <div class="button-group">
                <button id="reset-button">Reset</button>
                <button id="apply-button">Apply Formula</button>
            </div>
        </div>
    </div>
    <script type="module">

        // --- Constants ---
        const DEFAULT_SEED = 'hello-voxel';

        const seedInput = document.getElementById('seed');

        let colorStops = [

            { pos: 0.75, color: '#228833' }, // New grass green stop halfway between shore and end
            { pos: 1, color: '#338811' }

        let shorelineColorStop = { pos: 0.5, color: '#00ffff' }; // Default Cyan for sea
        let landColorStop = { pos: 0.501, color: '#eedd88' }; // Default Red for land
        // Helper functions
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function smoothstep(edge0, edge1, x) {
            const t = clamp((x - edge0) / (edge1 - edge - 0), 0, 1);
            return t * t * (3 - 2 * t);
        }
        function lerp(a, b, t) { return a * (1 - t) + b * t; }
        // --- Debounce Utility for Real-time Updates ---
        let debounceTimeout;
        function debounce(func, delay) {
            return function (...args) {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }
        const debouncedGeneratePlanet = debounce(generatePlanet, 300);
        const debouncedUpdateWater = debounce(updateWaterSphere, 50);

        let scene, camera, renderer, planetMesh, waterMesh, controls3d;
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 80;
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            controls3d = new OrbitControls(camera, renderer.domElement);
            controls3d.enableDamping = true;
            controls3d.dampingFactor = 0.05;
            controls3d.rotateSpeed = 0.5;
            const ambient = new THREE.AmbientLight(0xcccccc, 0.5);
            scene.add(ambient);
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1, 1, 1);
            scene.add(light);
            setupEventListeners();
            setupValueSync();
            initGradientEditor();
            updateFormula(); // Set initial formula text
            generateRandomSeed(); // Set initial random seed
            createWaterSphere(); // Create water mesh before generating planet
            generatePlanet();
            // Use ResizeObserver for robust canvas resizing
            const resizeObserver = new ResizeObserver(handleResize);
            resizeObserver.observe(container);
            animate();
        }

                            vertices.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z);
                            colors.push(color.r, color.g, color.b, color.r, color.g, color.b, color.r, color.g, color.b);
                            indices.push(currentVertexCount, currentVertexCount + 1, currentVertexCount + 2);
                        }
                    }
                }
            }
            const geometry = new THREE.BufferGeometry();
            if (vertices.length > 0) {
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
            }
            return geometry;
        }
        // --- Gradient Editor Functions ---
        function initGradientEditor() {
            renderShorelineStop();
            renderLandStop();
            renderColorStops();
            updateGradientPreview();
            updateWaterLevelMarker();
        }
        function renderShorelineStop() {
            shorelineColorContainer.innerHTML = '';
            
            // Shoreline (water) color stop
            const shorelineDiv = document.createElement('div');
            shorelineDiv.className = 'color-stop';
            const shorelineColorInput = document.createElement('input');
            shorelineColorInput.type = 'color';
            shorelineColorInput.value = shorelineColorStop.color;
            shorelineColorInput.title = 'Shoreline Water Color (Cyan)';
            shorelineColorInput.addEventListener('input', (e) => {
                shorelineColorStop.color = e.target.value;
                updateGradientPreview();
                debouncedUpdateWater();
            });
            const shorelineLabel = document.createElement('label');
            shorelineLabel.textContent = 'Water Shore';
            shorelineLabel.style.marginLeft = '10px';
            shorelineDiv.appendChild(shorelineColorInput);
            shorelineDiv.appendChild(shorelineLabel);
            shorelineColorContainer.appendChild(shorelineDiv);
        }
        
        function renderLandStop() {
            // Land color stop
            const landDiv = document.createElement('div');
            landDiv.className = 'color-stop';
            const landColorInput = document.createElement('input');
            landColorInput.type = 'color';
            landColorInput.value = landColorStop.color;
            landColorInput.title = 'Land Shore Color (Red)';
            landColorInput.addEventListener('input', (e) => {
                landColorStop.color = e.target.value;
                updateGradientPreview();
                debouncedUpdateWater();
            });
            const landLabel = document.createElement('label');
            landLabel.textContent = 'Land Shore';
            landLabel.style.marginLeft = '10px';
            landDiv.appendChild(landColorInput);
            landDiv.appendChild(landLabel);
            shorelineColorContainer.appendChild(landDiv);
        }
        function renderColorStops() {
            colorStopsContainer.innerHTML = '';
            colorStops.forEach((stop, index) => {
                const stopDiv = document.createElement('div');
                stopDiv.className = 'color-stop';
                const colorInput = document.createElement('input');
                colorInput.type = 'color';
                colorInput.value = stop.color;
                colorInput.addEventListener('input', (e) => {
                    stop.color = e.target.value;
                    updateGradientPreview();
                    debouncedUpdateWater();
                });
                const posInput = document.createElement('input');
                posInput.type = 'range';
                posInput.min = 0;
                posInput.max = 1;
                posInput.step = 0.01;
                posInput.value = stop.pos;
                posInput.disabled = (index === 0 || index === colorStops.length - 1); // Disable ends
                posInput.addEventListener('input', (e) => {
                    stop.pos = parseFloat(e.target.value);
                    const posLabel = e.target.nextElementSibling;
                    posLabel.textContent = parseFloat(e.target.value).toFixed(2);
                    sortAndRenderGradient();
                });
                const posLabel = document.createElement('span');
                posLabel.className = 'color-stop-value';
                posLabel.textContent = stop.pos.toFixed(2);
                const removeButton = document.createElement('button');
                removeButton.innerHTML = '&times;';
                removeButton.className = 'remove-color-button';
                if (index === 0 || index === colorStops.length - 1) {
                    removeButton.style.visibility = 'hidden';
                }
                removeButton.onclick = () => {
                    colorStops.splice(index, 1);
                    sortAndRenderGradient();
                };
                stopDiv.appendChild(colorInput);
                stopDiv.appendChild(posInput);
                stopDiv.appendChild(posLabel);
                stopDiv.appendChild(removeButton);
                colorStopsContainer.appendChild(stopDiv);
            });
        }
        function updateGradientPreview() {
            const allStops = [...colorStops, shorelineColorStop, landColorStop].sort((a, b) => a.pos - b.pos);
            const gradientString = allStops
                .map(stop => `${stop.color} ${stop.pos * 100}%`)
                .join(', ');
            gradientPreview.style.background = `linear-gradient(to right, ${gradientString})`;
        }
        function updateWaterLevelMarker() {
            const waterLevel = parseFloat(controls.waterLevel.value);
            const strength = parseFloat(controls.strength.value) || 1.0;
            const shorelineNoise = waterLevel - ISO_LEVEL;
            const oldShoreline_t = shorelineColorStop.pos;
            const shoreline_t = clamp(((shorelineNoise / strength) + 1) / 2, 0, 1);
            
            // Scale water-side color stops to maintain their relative positions
            scaleColorStops(oldShoreline_t, shoreline_t);
            
            // Update shoreline positions
            shorelineColorStop.pos = shoreline_t;
            landColorStop.pos = Math.min(shoreline_t + 0.001, 1.0); // Very close to shoreline on land side
            
            const marker = document.getElementById('water-level-marker');
            marker.style.left = `${shoreline_t * 100}%`;
            marker.title = `Shoreline position: ${shoreline_t.toFixed(3)}`;
            updateGradientPreview();
        }
        
        function scaleColorStops(oldShorelinePos, newShorelinePos) {
            colorStops.forEach(stop => {
                if (stop.pos < oldShorelinePos) {
                    // Water-side stops: scale proportionally within water area
                    const waterRatio = stop.pos / oldShorelinePos;
                    stop.pos = waterRatio * newShorelinePos;
                } else if (stop.pos > oldShorelinePos) {
                    // Land-side stops: scale proportionally within land area
                    const landRatio = (stop.pos - oldShorelinePos) / (1.0 - oldShorelinePos);
                    stop.pos = newShorelinePos + landRatio * (1.0 - newShorelinePos);
                }
            });
        }
        function sortAndRenderGradient() {
            colorStops.sort((a, b) => a.pos - b.pos);
            renderColorStops();
            updateGradientPreview();
            debouncedUpdateWater();
        }
        function addColorStop() {
            let allStops = [...colorStops, shorelineColorStop, landColorStop].sort((a, b) => a.pos - b.pos);
            let maxGap = 0;
            let insertIndex = 1; // Corresponds to index in the main `colorStops` array
            let newPos = 0.5;
            for (let i = 0; i < allStops.length - 1; i++) {
                const gap = allStops[i + 1].pos - allStops[i].pos;
                if (gap > maxGap) {
                    maxGap = gap;
                    newPos = allStops[i].pos + gap / 2;
                }
            }
            const c1 = getGradientColor(newPos - 0.001); // Get colors on either side of the insertion point
            const c2 = getGradientColor(newPos + 0.001);
            const newColor = c1.lerp(c2, 0.5).getHexString();
            colorStops.push({ pos: newPos, color: `#${newColor}` });
            sortAndRenderGradient();
        }
        function getGradientColor(t) {
            const allStops = [...colorStops, shorelineColorStop, landColorStop].sort((a, b) => a.pos - b.pos);
            if (t <= allStops[0].pos) return new THREE.Color(allStops[0].color);
            if (t >= allStops[allStops.length - 1].pos) return new THREE.Color(allStops[allStops.length - 1].color);
            let stop1 = allStops[0];
            let stop2 = allStops[allStops.length - 1];
            for (let i = 0; i < allStops.length - 1; i++) {
                if (t >= allStops[i].pos && t <= allStops[i + 1].pos) {
                    stop1 = allStops[i];
                    stop2 = allStops[i + 1];
                    break;
                }
            }
            const range = stop2.pos - stop1.pos;
            const localT = (range < 0.0001) ? 0 : (t - stop1.pos) / range;
            const color = new THREE.Color(stop1.color);
            color.lerp(new THREE.Color(stop2.color), localT);
            return color;
        }
        // --- Water Sphere Functions ---
        function createWaterSphere() {
            const geometry = new THREE.SphereGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({
                transparent: true,
                shininess: 100,
                specular: 0x111111,
                side: THREE.DoubleSide,
                vertexColors: true
            });
            waterMesh = new THREE.Mesh(geometry, material);
            scene.add(waterMesh);
            waterMesh.visible = controls.showWater.checked;
        }
        function updateWaterSphere() {
            if (!waterMesh || !simplex) return;
            const waterLevel = parseFloat(controls.waterLevel.value);
            const transparency = parseFloat(controls.waterTransparency.value);
            const radius = PLANET_RADIUS * waterLevel;
            
            const isRocky = controls.rockyPlanet.checked;
            const soilColor = new THREE.Color(controls.soilColor.value);
            
            const p = {
                scale: parseFloat(controls.scale.value),
                strength: parseFloat(controls.strength.value),
                useFractal: controls.useFractal.checked,
                levels: parseInt(controls.levels.value, 10),
                lacunarity: parseFloat(controls.lacunarity.value),
                persistence: parseFloat(controls.persistence.value),
                ridgedBlend: parseFloat(controls.ridgedBlend.value),
            };
            
            waterMesh.geometry.dispose();
            const geometry = new THREE.SphereGeometry(radius, 64, 32);
            const positions = geometry.attributes.position;
            const vertexCount = positions.count;
            const colors = new Float32Array(vertexCount * 3);
            
            for (let i = 0; i < vertexCount; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = positions.getZ(i);
                const terrainNoise = noiseFunction(simplex, x, y, z, p);
                const t = clamp((terrainNoise / p.strength + 1) / 2, 0, 1);
                
                let finalColor;
                if (isRocky) {
                    // Use rocky planet colors for low LOD
                    const rockColor = soilColor.clone().multiplyScalar(0.6).offsetHSL(0, -0.1, 0);
                    const highlandColor = soilColor.clone().multiplyScalar(1.2).offsetHSL(0, 0, 0.05);
                    const lowlandColor = soilColor.clone().multiplyScalar(0.4).offsetHSL(0, 0, -0.1);
                    
                    if (t < 0.33) {
                        finalColor = lowlandColor.clone().lerp(soilColor, t * 3);
                    } else if (t < 0.67) {
                        finalColor = soilColor.clone().lerp(highlandColor, (t - 0.33) * 3);
                    } else {
                        finalColor = highlandColor.clone();
                    }
                } else {
                    // Use water gradient for Earth-like
                    finalColor = getGradientColor(t);
                }
                
                colors[i * 3] = finalColor.r;
                colors[i * 3 + 1] = finalColor.g;
                colors[i * 3 + 2] = finalColor.b;
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            waterMesh.geometry = geometry;
            waterMesh.material.opacity = 1 - transparency;
            waterMesh.visible = controls.showWater.checked;
            waterMesh.material.needsUpdate = true;
        }
        // --- Event Handling & UI ---
        const defaultFormula = `(function() {
    const lerp = (a, b, alpha) => a * (1.0 - alpha) + b * alpha;
    // --- BASE TERRAIN GENERATION ---
    let terrainNoise;
    if (!p.useFractal) {
        const baseNoise = simplex.noise3D(x * p.scale, y * p.scale, z * p.scale);
        const ridgedVal = 1.0 - Math.abs(baseNoise);
        const finalNoise = lerp(baseNoise, ridgedVal * ridgedVal, p.ridgedBlend);
        terrainNoise = finalNoise * p.strength;
    } else {
        let total = 0;
        let amplitude = 1.0; // keep normalized
        let frequency = p.scale;
        let maxAmplitude = 0;
        for (let i = 0; i < p.levels; i++) {
            let baseNoise = simplex.noise3D(x * frequency, y * frequency, z * frequency);
            let ridgedVal = 1.0 - Math.abs(baseNoise);
            ridgedVal *= ridgedVal;
            const noiseVal = lerp(baseNoise, ridgedVal, p.ridgedBlend);
            total += noiseVal * amplitude;
            maxAmplitude += amplitude;
            amplitude *= p.persistence;
            frequency *= p.lacunarity;
        }
        // Apply strength AFTER normalization
        terrainNoise = (total / maxAmplitude) * p.strength;
    }
    // --- BEACH PLATEAU LOGIC ---
    if (p.beachWidth > 0.0001) {
        const ISO_LEVEL = 0.5;
        const waterLineNoise = p.waterLevel - ISO_LEVEL;
        const delta = terrainNoise - waterLineNoise;
        if (Math.abs(delta) < p.beachWidth) {
            const influence = 1.0 - (Math.abs(delta) / p.beachWidth);
            terrainNoise = lerp(terrainNoise, waterLineNoise, influence * influence);
        }
    }
    return terrainNoise;
})();`;
        function updateFormula() {
            formulaText.value = defaultFormula;
        }
        function generateRandomSeed() {
            seedInput.value = Math.random().toString(36).substring(2, 15);
        }
        function setupValueSync() {
            document.querySelectorAll('input[type="range"]').forEach(slider => {
                const numberInput = document.getElementById(slider.id + '-value');
                if (!numberInput) return;
                const updateValues = (source) => {
                    let value = parseFloat(source.value);
                    const min = parseFloat(slider.min);
                    const max = parseFloat(slider.max);
                    const step = parseFloat(slider.step);
                    if (isNaN(value)) value = min;
                    value = Math.max(min, Math.min(max, value));
                    if (source.type === 'number') {
                        value = Math.round(value / step) * step;
                    }
                    const decimals = (step.toString().split('.')[1] || []).length;
                    const formattedValue = value.toFixed(decimals);
                    slider.value = formattedValue;
                    numberInput.value = formattedValue;
                    updateWaterLevelMarker();
                    if (slider.id === 'waterTransparency') {
                        if (waterMesh) waterMesh.material.opacity = 1 - value;
                    } else if (slider.id === 'terrainTransparency') {
                        if (planetMesh) {
                            planetMesh.material.transparent = value > 0;
                            planetMesh.material.opacity = 1 - value;
                            planetMesh.material.needsUpdate = true;
                        }
                    } else {
                        debouncedGeneratePlanet();
                    }
                };
                slider.addEventListener('input', () => updateValues(slider));
                numberInput.addEventListener('change', () => updateValues(numberInput));
            });
        }
        function exportSettings() {
            const settings = {
                seed: seedInput.value,
                formula: formulaText.value,
                colorStops: colorStops,
                shorelineColor: shorelineColorStop.color,
                landColor: landColorStop.color
            };
            for (const key in controls) {
                const element = controls[key];
                settings[key] = element.type === 'checkbox' ? element.checked : element.value;
            }
            const settingsString = JSON.stringify(settings, null, 2);
            const blob = new Blob([settingsString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `planet-settings-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        function loadSettings(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const settings = JSON.parse(e.target.result);
                    if (!settings.seed || !settings.formula) {
                        console.error('Invalid settings file: missing seed or formula.');
                        return;
                    }
                    seedInput.value = settings.seed;
                    formulaText.value = settings.formula;
                    if (settings.colorStops) colorStops = settings.colorStops;
                    if (settings.shorelineColor) shorelineColorStop.color = settings.shorelineColor;
                    if (settings.landColor) landColorStop.color = settings.landColor;
                    for (const key in controls) {
                        if (settings.hasOwnProperty(key)) {
                            const element = controls[key];
                            if (element.type === 'checkbox') {
                                element.checked = settings[key];
                            } else {
                                element.value = settings[key];
                            }
                        }
                    }
                    document.querySelectorAll('input[type="range"]').forEach(slider => {
                        const numberInput = document.getElementById(slider.id + '-value');
                        if (numberInput) {
                            const decimals = (slider.step.toString().split('.')[1] || []).length;
                            numberInput.value = parseFloat(slider.value).toFixed(decimals);
                        }
                    });
                    initGradientEditor();
                    generatePlanet();
                } catch (error) {
                    console.error('Error loading or parsing settings file:', error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        function setupEventListeners() {
            seedInput.addEventListener('input', debouncedGeneratePlanet);
            controls.useFractal.addEventListener('change', generatePlanet);
            controls.showWater.addEventListener('change', () => {
                if (waterMesh) waterMesh.visible = controls.showWater.checked;
            });
            controls.rockyPlanet.addEventListener('change', generatePlanet);
            controls.soilColor.addEventListener('input', debouncedGeneratePlanet);
            addColorButton.addEventListener('click', addColorStop);
            randomSeedButton.addEventListener('click', () => {
                generateRandomSeed();
                generatePlanet();
            });
            applyButton.addEventListener('click', generatePlanet);
            resetButton.addEventListener('click', () => {
                controls.scale.value = 0.02;
                controls.strength.value = 1.0;
                controls.terrainTransparency.value = 0;
                controls.useFractal.checked = true;
                controls.levels.value = 6;
                controls.lacunarity.value = 2.0;
                controls.persistence.value = 0.5;
                controls.ridgedBlend.value = 0;
                controls.waterLevel.value = 0.7;
                controls.beachWidth.value = 0;
                controls.waterTransparency.value = 0.35;
                controls.showWater.checked = true;
                seedInput.value = DEFAULT_SEED;
                colorStops = [
                    { pos: 0, color: '#0088ff' }, 
                    { pos: 0.75, color: '#228833' }, // New grass green stop
                    { pos: 1, color: '#ffff00' }
                ];
                shorelineColorStop.color = '#00ffff';
                landColorStop.color = '#ff0000';
                document.querySelectorAll('input[type="range"]').forEach(slider => {
                    const numberInput = document.getElementById(slider.id + '-value');
                    if (numberInput) numberInput.value = slider.value;
                });
                initGradientEditor();
                updateFormula();
                generatePlanet();
            });
            exportSettingsButton.addEventListener('click', exportSettings);
            loadSettingsButton.addEventListener('click', () => loadSettingsInput.click());
            loadSettingsInput.addEventListener('change', loadSettings);
        }
        function animate() {
            requestAnimationFrame(animate);
            controls3d.update();
            renderer.render(scene, camera);
        }
        window.addEventListener('load', init);
    </script>
