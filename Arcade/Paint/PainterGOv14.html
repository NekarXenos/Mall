<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p5 Painter - Enhanced with Impasto & Detail</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  body { 
    margin: 0; 
    background: #1a1a1a; 
    color: #fff; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  
  #ui {
    width: 280px;
    background: #252525;
    padding: 20px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid #333;
    position: relative;
    overflow-y: auto;
  }

  .canvas-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    position: relative;
    overflow: auto;
  }

  h2 { margin: 0 0 5px 0; font-size: 1.2rem; color: #aaa; }

  .control-group {
    background: #333;
    padding: 12px;
    border-radius: 6px;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  label { font-size: 0.9rem; color: #ccc; }
  
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type="range"] { flex-grow: 1; cursor: pointer; }
  
  .btn-reset {
    width: auto;
    padding: 2px 6px;
    font-size: 0.7rem;
    background: #444;
    color: #bbb;
    border: 1px solid #555;
    border-radius: 3px;
    cursor: pointer;
    margin: 0;
    font-weight: normal;
  }
  .btn-reset:hover {
    background: #555;
    color: #fff;
  }

  select {
    width: 100%;
    padding: 8px;
    background: #444;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    margin-bottom: 5px;
  }

  .btn-paint { background: #4caf50; color: white; }
  .btn-paint:hover { background: #45a049; }
  .btn-save { background: #2196f3; color: white; }
  .btn-save:hover { background: #1e88e5; }

  #preview-container {
    margin-top: 10px;
    border: 2px solid #444;
    border-radius: 4px;
    background: #000;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #imgPreview {
    max-width: 100%;
    max-height: 200px;
    display: none;
  }

  .placeholder-text { color: #555; font-size: 0.8rem; text-align: center; }

  #loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    color: #4caf50;
    font-weight: bold;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #333;
    border-top: 4px solid #4caf50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .slider-marker {
    width: 100%;
    height: 4px;
    background: #444;
    margin-top: 2px;
    position: relative;
    grid-column: span 2;
  }
  .marker-mid {
    position: absolute;
    left: 50%;
    top: -2px;
    width: 2px;
    height: 8px;
    background: #888;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Painting Canvas...</div>
  </div>

  <h2>PainterGO</h2>
  
  <div class="control-group">
    <label style="display: block; margin-bottom: 8px;">1. Upload Photo</label>
    <input type="file" id="upload" accept="image/*" style="width: 100%;">
  </div>

  <div class="control-group">
    <div class="label-row">
      <label>2. Colors: <span id="colVal">256</span></label>
      <button class="btn-reset" onclick="resetSlider('colorSlider', 256)">Reset</button>
    </div>
    <div class="slider-row">
      <input type="range" id="colorSlider" min="2" max="1024" value="256">
    </div>
  </div>

  <div class="control-group">
    <label style="display: block; margin-bottom: 8px;">3. Palette Style</label>
    <select id="paletteMode">
      <option value="realistic" selected>Realistic (Averaged)</option>
      <option value="poster">Poster (High Contrast)</option>
    </select>
  </div>

  <div class="control-group">
    <div class="label-row">
      <label>4. Bristle Length: <span id="lenVal">1.0</span>x</label>
      <button class="btn-reset" onclick="resetSlider('lengthSlider', 1.0)">Reset</button>
    </div>
    <div class="slider-row">
      <input type="range" id="lengthSlider" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>
  </div>

  <div class="control-group">
    <div class="label-row">
      <label>5. Paint Thickness: <span id="alphaVal">50%</span></label>
      <button class="btn-reset" onclick="resetSlider('alphaSlider', 50)">Reset</button>
    </div>
    <div class="slider-row">
      <input type="range" id="alphaSlider" min="0" max="100" value="50">
    </div>
    <div class="slider-marker"><div class="marker-mid"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #666; margin-top: 4px;">
      <span>Thin</span>
      <span>Opaque</span>
      <span>Bold</span>
    </div>
  </div>

  <div class="control-group">
    <div class="label-row">
      <label>6. Angle Offset: <span id="angleVal">0&deg;</span></label>
      <button class="btn-reset" onclick="resetSlider('angleSlider', 0)">Reset</button>
    </div>
    <div class="slider-row">
      <input type="range" id="angleSlider" min="-180" max="180" value="0">
      <div id="angleWheel" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #aaa; position: relative; display: flex; justify-content: center; transform: rotate(0deg); flex-shrink: 0;">
        <div style="width: 2px; height: 8px; background: #4caf50; border-radius: 2px;"></div>
      </div>
    </div>
  </div>

  <!-- New Detail Slider Added Here -->
  <div class="control-group">
    <div class="label-row">
      <label>7. Add Detail: <span id="detailVal">0%</span></label>
      <button class="btn-reset" onclick="resetSlider('detailSlider', 0)">Reset</button>
    </div>
    <div class="slider-row">
      <input type="range" id="detailSlider" min="0" max="100" value="0">
    </div>
  </div>

  <button class="btn-paint" onclick="startProcessing()">Start Painting</button>
  <button class="btn-save" onclick="saveArtwork()">Save Image</button>

  <label style="margin-top:10px; display: block;">Source Preview:</label>
  <div id="preview-container">
    <span class="placeholder-text" id="previewLabel">No image selected</span>
    <img id="imgPreview" alt="Preview">
  </div>
</div>

<div class="canvas-container" id="p5-holder"></div>

<script>
let img;
let pieces = [];
let painted = false;
let ready = false;

// Settings captured at the time of "Start Painting"
let activeBristleAngleOffset = 0;
let activeBristleLengthScale = 1.0;
let activeBristleAlpha = 255;
let activeBristleStrokeWeight = 1;
let activeBristleSkip = 1; 
let activeDetailLevel = 0; // Captured Detail Level

let avgColor = [20, 20, 20];

const uploadInput = document.getElementById("upload");
const colorSlider = document.getElementById("colorSlider");
const colValLabel = document.getElementById("colVal");
const imgPreview = document.getElementById("imgPreview");
const previewLabel = document.getElementById("previewLabel");
const angleSlider = document.getElementById("angleSlider");
const angleValLabel = document.getElementById("angleVal");
const angleWheel = document.getElementById("angleWheel");
const loadingOverlay = document.getElementById("loading-overlay");
const paletteModeSelect = document.getElementById("paletteMode");

const lengthSlider = document.getElementById("lengthSlider");
const lenValLabel = document.getElementById("lenVal");
const alphaSlider = document.getElementById("alphaSlider");
const alphaValLabel = document.getElementById("alphaVal");
const detailSlider = document.getElementById("detailSlider");
const detailValLabel = document.getElementById("detailVal");

uploadInput.addEventListener("change", handleUpload);

colorSlider.addEventListener("input", e => colValLabel.innerText = e.target.value);
lengthSlider.addEventListener("input", e => lenValLabel.innerText = parseFloat(e.target.value).toFixed(1));
alphaSlider.addEventListener("input", e => alphaValLabel.innerText = e.target.value + "%");
detailSlider.addEventListener("input", e => detailValLabel.innerText = e.target.value + "%");
angleSlider.addEventListener("input", e => {
  const val = parseInt(e.target.value);
  updateAngleUI(val);
});

function updateAngleUI(val) {
  angleValLabel.innerHTML = val + '&deg;';
  angleWheel.style.transform = `rotate(${val}deg)`;
}

function resetSlider(id, val) {
  const slider = document.getElementById(id);
  slider.value = val;
  // Trigger the input event logic manually
  if (id === 'colorSlider') colValLabel.innerText = val;
  if (id === 'lengthSlider') lenValLabel.innerText = parseFloat(val).toFixed(1);
  if (id === 'alphaSlider') alphaValLabel.innerText = val + "%";
  if (id === 'angleSlider') updateAngleUI(val);
  if (id === 'detailSlider') detailValLabel.innerText = val + "%";
}

function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    imgPreview.src = e.target.result;
    imgPreview.style.display = "block";
    previewLabel.style.display = "none";

    loadImage(e.target.result, loaded => {
      img = loaded;
      resizeCanvas(img.width, img.height);
      ready = true;
      painted = false;
      background(20);
    });
  };
  reader.readAsDataURL(file);
}

function setup() {
  const canvas = createCanvas(300, 300);
  canvas.parent('p5-holder');
  background(20);
}

function startProcessing() {
  if (!img) return;
  
  const thicknessPercent = parseInt(alphaSlider.value);
  
  if (thicknessPercent <= 50) {
    activeBristleAlpha = map(thicknessPercent, 0, 50, 0, 255);
    activeBristleStrokeWeight = 1;
    activeBristleSkip = 1;
  } else {
    activeBristleAlpha = 255;
    activeBristleStrokeWeight = map(thicknessPercent, 50, 100, 1, 5);
    activeBristleSkip = max(1, floor(activeBristleStrokeWeight));
  }
  
  activeBristleLengthScale = parseFloat(lengthSlider.value);
  activeBristleAngleOffset = parseInt(angleSlider.value);
  activeDetailLevel = parseInt(detailSlider.value);

  loadingOverlay.style.display = "flex";
  setTimeout(() => {
    processImage();
    loadingOverlay.style.display = "none";
  }, 100);
}

function processImage() {
  img.loadPixels();
  pieces = [];

  avgColor = getAverageColor(img);
  background(avgColor[0], avgColor[1], avgColor[2]);

  let quantized = quantizeImage(img, parseInt(colorSlider.value));
  let blobs = extractBlobs(quantized);
  let isRealistic = paletteModeSelect.value === 'realistic';

  for (let blob of blobs) {
    let hull = convexHull(blob.pixels);
    let angle = findBestAngle(hull);
    
    let finalColor;
    if (isRealistic) {
      finalColor = getBlobAverageColor(img, blob.pixels);
    } else {
      let levels = max(2, floor(pow(parseInt(colorSlider.value), 1/3)));
      let step = 256 / levels;
      finalColor = blob.colorKey.split(",").map(v => v * step);
    }

    pieces.push({
      pixels: blob.pixels,
      color: finalColor,
      angle: angle,
      size: blob.pixels.length
    });
  }

  pieces.sort((a, b) => b.size - a.size);
  painted = false;
}

function saveArtwork() {
  saveCanvas('my_painting', 'png');
}

function draw() {
  if (!ready || painted || pieces.length === 0) return;

  // 1. Draw base abstract brush strokes
  for (let piece of pieces) {
    drawBrushStroke(piece);
  }

  // 2. Overlay structure/detail if requested
  if (activeDetailLevel > 0) {
    drawDetails(activeDetailLevel);
  }

  painted = true;
}

// Extract luminance and find gradients to detect strong edges for detailed strokes
function drawDetails(level) {
  push();
  // Generate random samples relative to detail level (e.g., 2.5x the area for 100% detail)
  let attempts = floor((img.width * img.height) * (level / 100) * 2.5);
  // Lower gradient threshold as detail goes up to pick up softer edges
  let threshold = map(level, 0, 100, 60, 15); 
  
  let isImpasto = activeBristleStrokeWeight > 4;
  let detailWeight = isImpasto ? max(1.5, activeBristleStrokeWeight / 2.5) : map(level, 0, 100, 0.5, 1.5);
  
  strokeWeight(detailWeight);
  strokeCap(ROUND);

  for (let i = 0; i < attempts; i++) {
    let x = floor(random(1, img.width - 1));
    let y = floor(random(1, img.height - 1));

    // Get indices for adjacent pixels to calculate local gradient
    let idxRight = (y * img.width + (x + 1)) * 4;
    let idxLeft  = (y * img.width + (x - 1)) * 4;
    let idxDown  = ((y + 1) * img.width + x) * 4;
    let idxUp    = ((y - 1) * img.width + x) * 4;

    // Luminance approximation differences (X and Y axis)
    let lumX = (0.299*img.pixels[idxRight] + 0.587*img.pixels[idxRight+1] + 0.114*img.pixels[idxRight+2]) - 
               (0.299*img.pixels[idxLeft] + 0.587*img.pixels[idxLeft+1] + 0.114*img.pixels[idxLeft+2]);
    let lumY = (0.299*img.pixels[idxDown] + 0.587*img.pixels[idxDown+1] + 0.114*img.pixels[idxDown+2]) - 
               (0.299*img.pixels[idxUp] + 0.587*img.pixels[idxUp+1] + 0.114*img.pixels[idxUp+2]);

    let mag = sqrt(lumX*lumX + lumY*lumY);

    if (mag > threshold) {
      // Stroke angle is perpendicular to the gradient (follows the object shape)
      let angle = atan2(lumY, lumX) + HALF_PI;
      
      let idxCenter = (y * img.width + x) * 4;
      let r = img.pixels[idxCenter];
      let g = img.pixels[idxCenter+1];
      let b = img.pixels[idxCenter+2];
      let lum = 0.299*r + 0.587*g + 0.114*b;

      // Make detail strokes relatively short but scale with global bristle length
      let strokeLen = random(3, 8) * activeBristleLengthScale;

      // Draw shadow or highlight based on center luminance
      if (lum > 128) {
        // Highlight (Add lightness)
        stroke(min(r + 80, 255), min(g + 80, 255), min(b + 80, 255), 210);
      } else {
        // Shadow (Subtract lightness)
        stroke(max(r - 80, 0), max(g - 80, 0), max(b - 80, 0), 210);
      }

      let dx = cos(angle) * strokeLen / 2;
      let dy = sin(angle) * strokeLen / 2;

      // Additional depth styling for impasto
      if (isImpasto) {
        push();
        strokeWeight(detailWeight);
        stroke(max(r-100,0), max(g-100,0), max(b-100,0), 100);
        line(x - dx, (y - dy) + detailWeight/1.5, x + dx, (y + dy) + detailWeight/1.5);
        pop();
      }

      line(x - dx, y - dy, x + dx, y + dy);
    }
  }
  pop();
}

function getAverageColor(img) {
  let r=0,g=0,b=0;
  let total = img.pixels.length / 4;
  for (let i = 0; i < img.pixels.length; i += 4) {
    r += img.pixels[i];
    g += img.pixels[i+1];
    b += img.pixels[i+2];
  }
  return [r/total, g/total, b/total];
}

function getBlobAverageColor(img, pixels) {
  let r=0, g=0, b=0;
  for (let p of pixels) {
    let i = (floor(p.x) + floor(p.y) * img.width) * 4;
    r += img.pixels[i];
    g += img.pixels[i+1];
    b += img.pixels[i+2];
  }
  let count = pixels.length;
  return [r/count, g/count, b/count];
}

function quantizeImage(img, count) {
  let levels = max(2, floor(pow(count, 1/3)));
  let step = 256 / levels;
  let mapData = [];
  for (let y = 0; y < img.height; y++) {
    mapData[y] = [];
    for (let x = 0; x < img.width; x++) {
      let i = (x + y * img.width) * 4;
      let r = floor(img.pixels[i] / step);
      let g = floor(img.pixels[i+1] / step);
      let b = floor(img.pixels[i+2] / step);
      mapData[y][x] = `${r},${g},${b}`;
    }
  }
  return { map: mapData, levels, step };
}

function extractBlobs(data) {
  let map = data.map;
  let visited = Array.from({length: map.length}, () => Array(map[0].length).fill(false));
  let blobs = [];
  let dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[0].length; x++) {
      if (visited[y][x]) continue;

      let colorKey = map[y][x];
      let stack = [[x,y]];
      let pixels = [];

      while (stack.length) {
        let [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= map[0].length || cy >= map.length) continue;
        if (visited[cy][cx] || map[cy][cx] !== colorKey) continue;

        visited[cy][cx] = true;
        pixels.push(createVector(cx, cy));
        for (let d of dirs) stack.push([cx + d[0], cy + d[1]]);
      }
      if (pixels.length > 20) blobs.push({ pixels, colorKey });
    }
  }
  return blobs;
}

function convexHull(points) {
  if (points.length < 3) return points;
  points.sort((a,b)=> a.x === b.x ? a.y - b.y : a.x - b.x);
  let cross = (o,a,b)=> (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  let lower = [];
  for (let p of points) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  let upper = [];
  for (let i = points.length - 1; i >= 0; i--) {
    let p = points[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function findBestAngle(hull) {
  let bestAngle = 0;
  let bestRatio = 0;
  for (let a = 0; a < 180; a += 15) {
    let rad = radians(a);
    let xs = [], ys = [];
    for (let p of hull) {
      xs.push(p.x * cos(rad) - p.y * sin(rad));
      ys.push(p.x * sin(rad) + p.y * cos(rad));
    }
    let w = max(xs) - min(xs);
    let h = max(ys) - min(ys);
    let ratio = w / (h + 0.0001);
    if (ratio > bestRatio) { bestRatio = ratio; bestAngle = a; }
  }
  return bestAngle;
}

function drawBrushStroke(piece) {
  push();
  
  let rad = radians((piece.angle !== undefined ? piece.angle : 0) + activeBristleAngleOffset);
  let cosA = cos(rad);
  let sinA = sin(rad);

  let baseLen = sqrt(piece.size) * 1.5;
  let isImpasto = activeBristleStrokeWeight > 4;

  if (!isImpasto) {
    stroke(piece.color[0], piece.color[1], piece.color[2], activeBristleAlpha);
    strokeWeight(activeBristleStrokeWeight);
  }

  for (let i = 0; i < piece.pixels.length; i += activeBristleSkip) {
    let p = piece.pixels[i];
    let len = baseLen * activeBristleLengthScale * random(0.8, 1.2);
    
    let spread = random(-1, 1);
    let startX = random(-0.5, 0.5);
    let startY = spread;
    let endX = len + random(-1, 1);
    let endY = spread + random(-0.3, 0.3);

    let x1 = p.x + startX * cosA - startY * sinA;
    let y1 = p.y + startX * sinA + startY * cosA;
    let x2 = p.x + endX * cosA - endY * sinA;
    let y2 = p.y + endX * sinA + endY * cosA;

    if (isImpasto) {
      let offset = activeBristleStrokeWeight / 2;
      strokeWeight(2);
      stroke(piece.color[0] * 0.5, piece.color[1] * 0.5, piece.color[2] * 0.5, 32);
      line(x1, y1 + offset, x2, y2 + offset);
      
      strokeWeight(activeBristleStrokeWeight);
      stroke(piece.color[0], piece.color[1], piece.color[2], activeBristleAlpha);
      line(x1, y1, x2, y2);

      strokeWeight(2);
      stroke( piece.color[0] +10, piece.color[1] +10, piece.color[2] +10, 128);
      line(x1, y1 - (offset/2), x2, y2 - (offset/2));
    } else {
      line(x1, y1, x2, y2);
    }
  }
  pop();
}
</script>
</body>
</html>
