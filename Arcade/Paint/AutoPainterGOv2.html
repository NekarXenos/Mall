<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>p5 GO Painter - Auto & Manual Paint</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: row-reverse;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    #ui {
      width: 280px;
      background: #252525;
      padding: 20px;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-left: 1px solid #333;
      position: relative;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #ui::-webkit-scrollbar {
      width: 8px;
    }

    #ui::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #ui::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }


    h1 {
      font-size: 1.2rem;
      margin: 0 0 5px;
      color: #00d2ff;
    }

    .version {
      font-size: 0.7rem;
      color: #888;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    .section {
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 5px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 10px;
      display: block;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
    }

    label span {
      color: #00d2ff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00d2ff;
      cursor: pointer;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #3d3d3d;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    button:hover {
      background: #555;
    }

    button.active {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
    }

    button.primary {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
    }

    button.primary:hover {
      background: #00b8e6;
    }

    .canvas-container {
      flex-grow: 1;
      display: flex;
      background: #111;
      position: relative;
      overflow: auto;
    }

    #p5-holder canvas {
      margin: auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      transform-origin: top left;
    }

    h2 {
      margin: 0 0 5px 0;
      font-size: 1.2rem;
      color: #aaa;
    }

    .control-group {
      background: #333;
      padding: 12px;
      border-radius: 6px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #ccc;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex-grow: 1;
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .btn-reset {
      width: auto;
      padding: 2px 6px;
      font-size: 0.7rem;
      background: #444;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
      margin: 0;
      font-weight: normal;
    }

    .btn-reset:hover {
      background: #555;
      color: #fff;
    }

    .btn-mini-toggle {
      background: #444;
      color: #fff;
      padding: 2px 6px;
      font-size: 0.65rem;
      border-radius: 4px;
      border: 1px solid #666;
      cursor: pointer;
      width: auto;
      margin: 0;
    }

    .btn-mini-toggle.active {
      background: #4caf50;
      border-color: #45a049;
    }

    .btn-mini-toggle.disabled {
      background: #600;
      border-color: #800;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 8px;
      background: #444;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 5px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-paint {
      background: #4caf50;
      color: white;
    }

    .btn-paint:hover {
      background: #45a049;
    }

    .btn-save {
      background: #2196f3;
      color: white;
    }

    .btn-save:hover {
      background: #1e88e5;
    }

    .btn-toggle {
      background: #ff9800;
      color: white;
      margin-top: 10px;
    }

    .btn-toggle:hover {
      background: #e68a00;
    }

    #preview-container {
      margin-top: 10px;
      border: 2px solid #444;
      border-radius: 4px;
      background: #000;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #imgPreview {
      max-width: 100%;
      max-height: 200px;
      display: none;
    }

    .placeholder-text {
      color: #555;
      font-size: 0.8rem;
      text-align: center;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      color: #4caf50;
      font-weight: bold;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #4caf50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .slider-marker {
      width: 100%;
      height: 4px;
      background: #444;
      margin-top: 2px;
      position: relative;
    }

    .marker-mid {
      position: absolute;
      left: 50%;
      top: -2px;
      width: 2px;
      height: 8px;
      background: #888;
      transform: translateX(-50%);
    }

    #manual-ui {
      display: none;
      background: #2b2b2b;
      border: 1px solid #ff9800;
      border-radius: 6px;
      padding: 12px;
      flex-direction: column;
      gap: 12px;
    }

    .manual-header {
      color: #ff9800;
      font-size: 1rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #brush-preview-box {
      width: 100%;
      height: 150px;
      background: #111;
      border: 1px solid #444;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #brush-preview-canvas {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column-reverse;
      }

      #ui {
        width: 100%;
        height: 45vh;
        border-left: none;
        border-top: 1px solid #333;
        padding: 15px;
        box-sizing: border-box;
      }

      .canvas-container {
        height: 55vh;
        flex-grow: 0;
      }
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Painting Canvas...</div>
    </div>

    <h1>Painter GO</h1>

    <div id="auto-ui">
      <div class="control-group">
        <label style="display: block; margin-bottom: 8px;">1. Upload Photo</label>
        <input type="file" id="upload" accept="image/*" style="width: 100%;">
      </div>

      <div class="control-group">
        <div class="label-row">
          <label>2. Colors: <span id="colVal">512</span></label>
          <button class="btn-reset" onclick="resetSlider('colorSlider', 512)">Reset</button>
        </div>
        <div class="slider-row">
          <input type="range" id="colorSlider" min="2" max="1024" value="512">
        </div>
      </div>

      <div class="control-group">
        <label style="display: block; margin-bottom: 8px;">3. Palette Style</label>
        <select id="paletteMode">
          <option value="realistic" selected>Realistic (Averaged)</option>
          <option value="poster">Poster (High Contrast)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="label-row">
          <label>4. Bristle Length: <span id="lenVal">1.0</span>x</label>
          <button class="btn-reset" onclick="resetSlider('lengthSlider', 1.0)">Reset</button>
        </div>
        <div class="slider-row">
          <input type="range" id="lengthSlider" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
      </div>

      <div class="control-group">
        <div class="label-row">
          <label>5. Paint Thickness: <span id="alphaVal">40%</span></label>
          <button class="btn-reset" onclick="resetSlider('alphaSlider', 40)">Reset</button>
        </div>
        <div class="slider-row">
          <input type="range" id="alphaSlider" min="0" max="100" value="40">
        </div>
        <div class="slider-marker">
          <div class="marker-mid"></div>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row">
          <label>6. Angle Offset: <span id="angleVal">0&deg;</span></label>
          <button class="btn-reset" onclick="resetSlider('angleSlider', 0)">Reset</button>
        </div>
        <div class="slider-row">
          <input type="range" id="angleSlider" min="-180" max="180" value="0">
          <div id="angleWheel"
            style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #aaa; position: relative; display: flex; justify-content: center; transform: rotate(0deg); flex-shrink: 0;">
            <div style="width: 2px; height: 8px; background: #4caf50; border-radius: 2px;"></div>
          </div>
        </div>
      </div>

      <div class="control-group">

        <div class="label-row">
          <label>8. Add Light Details: <span id="detailLightVal">10%</span></label>
          <button class="btn-reset" onclick="resetSlider('detailLightSlider',10)">Reset</button>
        </div>

        <div class="slider-row">
          <input type="range" id="detailLightSlider" min="0" max="100" value="10">
        </div>

        <div class="label-row" style="margin-top:10px;">
          <label>Add Shadow Details: <span id="detailShadowVal">10%</span></label>
          <button class="btn-reset" onclick="resetSlider('detailShadowSlider',10)">Reset</button>
        </div>

        <div class="slider-row">
          <input type="range" id="detailShadowSlider" min="0" max="100" value="10">
        </div>

        <div class="label-row" style="margin-top:10px;">
          <label>Detail Brush Size: <span id="detailSizeVal">1.0</span></label>
          <button class="btn-reset" onclick="resetSlider('detailSizeSlider',1.0)">Reset</button>
        </div>

        <div class="slider-row">
          <input type="range" id="detailSizeSlider" min="0.5" max="10" step="0.1" value="1.0">
        </div>

      </div>

      <button class="btn-paint" onclick="startProcessing()">AutoPaint Canvas</button>
    </div> <!-- End Auto UI -->

    <button id="btn-toggle-manual" class="btn-toggle" onclick="toggleManualMode()">🖌️ Switch to Manual Paint</button>

    <div id="manual-ui">
      <h3 class="manual-header">🖌️ Manual Tools</h3>
      <div id="brush-preview-box">
        <canvas id="brush-preview-canvas"></canvas>
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Brush Color</label></div>
        <input type="color" id="manualColor" value="#ffeb3b">
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Brush Size: <span id="manSizeVal">40</span></label></div>
        <input type="range" id="manualSize" min="5" max="150" value="40">
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Transparency: <span id="manAlphaVal">100%</span></label></div>
        <input type="range" id="manualAlpha" min="1" max="100" value="100">
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Wet Paint Mix: <span id="manBlendVal">0%</span></label></div>
        <input type="range" id="manualBlend" min="0" max="100" value="0">
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Bristles: <span id="manBristleVal">30</span></label></div>
        <input type="range" id="manualBristles" min="5" max="100" value="30">
      </div>
      <div class="control-group" style="background: #222;">
        <div class="label-row"><label>Damping: <span id="manDampingVal">0.15</span></label></div>
        <input type="range" id="manualDamping" min="1" max="50" value="15">
      </div>
    </div>

    <button class="btn-save" onclick="saveArtwork()">💾 Save Image</button>

    <label style="margin-top:10px; display: block;">Source Preview:</label>
    <div id="preview-container">
      <span class="placeholder-text" id="previewLabel">No image selected</span>
      <img id="imgPreview" alt="Preview">
    </div>
  </div>

  <div class="canvas-container" id="p5-holder"></div>

  <script>
    // ==========================================
    // P5.JS AUTO-PAINTING LOGIC
    // ==========================================
    let img;
    let pieces = [];
    let painted = false;
    let ready = false;
    let p5CanvasElt;

    let currentScale = 1;

    let activeBristleAngleOffset = 0;
    let activeBristleLengthScale = 1.0;
    let activeBristleAlpha = 255;
    let activeBristleStrokeWeight = 1;
    let activeBristleSkip = 1;
    //let activeDetailLevel = 0; 
    let activeLightDetailLevel = 0;
    let activeShadowDetailLevel = 0;
    let activeDetailSizeMultiplier = 1.0;
    let avgColor = [20, 20, 20];

    let isDefaultAngleEnabled = true;
    let activeDefaultAngleValue = 45;

    const uploadInput = document.getElementById("upload");
    const colorSlider = document.getElementById("colorSlider");
    const colValLabel = document.getElementById("colVal");
    const imgPreview = document.getElementById("imgPreview");
    const previewLabel = document.getElementById("previewLabel");
    const angleSlider = document.getElementById("angleSlider");
    const angleValLabel = document.getElementById("angleVal");
    const angleWheel = document.getElementById("angleWheel");

    /* const defAngleSlider = document.getElementById("defAngleSlider");
    const defAngleValLabel = document.getElementById("defAngleVal");
    const defAngleWheel = document.getElementById("defAngleWheel");
    const toggleDefAngleBtn = document.getElementById("toggleDefAngle"); */

    const loadingOverlay = document.getElementById("loading-overlay");
    const paletteModeSelect = document.getElementById("paletteMode");
    const lengthSlider = document.getElementById("lengthSlider");
    const lenValLabel = document.getElementById("lenVal");
    const alphaSlider = document.getElementById("alphaSlider");
    const alphaValLabel = document.getElementById("alphaVal");

    //const detailSlider = document.getElementById("detailSlider");
    //const detailValLabel = document.getElementById("detailVal");
    const detailLightSlider = document.getElementById("detailLightSlider");
    const detailLightValLabel = document.getElementById("detailLightVal");

    const detailShadowSlider = document.getElementById("detailShadowSlider");
    const detailShadowValLabel = document.getElementById("detailShadowVal");

    const detailSizeSlider = document.getElementById("detailSizeSlider");
    const detailSizeValLabel = document.getElementById("detailSizeVal");

    uploadInput.addEventListener("change", handleUpload);
    colorSlider.addEventListener("input", e => colValLabel.innerText = e.target.value);
    lengthSlider.addEventListener("input", e => lenValLabel.innerText = parseFloat(e.target.value).toFixed(1));
    alphaSlider.addEventListener("input", e => alphaValLabel.innerText = e.target.value + "%");

    //detailSlider.addEventListener("input", e => detailValLabel.innerText = e.target.value + "%");
    detailLightSlider.addEventListener("input", e =>
      detailLightValLabel.innerText = e.target.value + "%");

    detailShadowSlider.addEventListener("input", e =>
      detailShadowValLabel.innerText = e.target.value + "%");

    detailSizeSlider.addEventListener("input", e => detailSizeValLabel.innerText = parseFloat(e.target.value).toFixed(1));

    angleSlider.addEventListener("input", e => {
      const val = parseInt(e.target.value);
      updateAngleUI(val);
    });

    /* defAngleSlider.addEventListener("input", e => {
      const val = parseInt(e.target.value);
      activeDefaultAngleValue = val;
      defAngleValLabel.innerHTML = val + '&deg;';
      defAngleWheel.style.transform = `rotate(${val}deg)`;
    }); */

    function updateAngleUI(val) {
      angleValLabel.innerHTML = val + '&deg;';
      angleWheel.style.transform = `rotate(${val}deg)`;
    }

    /* function toggleDefaultAngle() {
      isDefaultAngleEnabled = !isDefaultAngleEnabled;
      if (isDefaultAngleEnabled) {
        toggleDefAngleBtn.innerText = "Enabled";
        toggleDefAngleBtn.classList.add('active');
        toggleDefAngleBtn.classList.remove('disabled');
        defAngleSlider.disabled = false;
        defAngleSlider.style.opacity = "1";
      } else {
        toggleDefAngleBtn.innerText = "Disabled";
        toggleDefAngleBtn.classList.remove('active');
        toggleDefAngleBtn.classList.add('disabled');
        defAngleSlider.disabled = true;
        defAngleSlider.style.opacity = "0.4";
      }
    } */

    function resetSlider(id, val) {
      const slider = document.getElementById(id);
      slider.value = val;
      if (id === 'colorSlider') colValLabel.innerText = val;
      if (id === 'lengthSlider') lenValLabel.innerText = parseFloat(val).toFixed(1);
      if (id === 'alphaSlider') alphaValLabel.innerText = val + "%";
      if (id === 'angleSlider') updateAngleUI(val);
      //if (id === 'detailSlider') detailValLabel.innerText = val + "%";
      if (id === 'detailLightSlider')
        detailLightValLabel.innerText = val + "%";

      if (id === 'detailShadowSlider')
        detailShadowValLabel.innerText = val + "%";
      if (id === 'detailSizeSlider') detailSizeValLabel.innerText = parseFloat(val).toFixed(1);
    }

    function applyScale() {
      if (!p5CanvasElt) return;
      p5CanvasElt.style.width = (width * currentScale) + 'px';
      p5CanvasElt.style.height = (height * currentScale) + 'px';
    }

    function handleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        imgPreview.src = e.target.result;
        imgPreview.style.display = "block";
        previewLabel.style.display = "none";
        loadImage(e.target.result, loaded => {
          img = loaded;
          resizeCanvas(img.width, img.height);
          pixelDensity(1);
          const container = document.getElementById('p5-holder');
          const padding = 40;
          const scaleX = (container.clientWidth - padding) / img.width;
          const scaleY = (container.clientHeight - padding) / img.height;
          currentScale = Math.min(1, Math.min(scaleX, scaleY));
          applyScale();
          ready = true;
          painted = false;
          background(20);
        });
      };
      reader.readAsDataURL(file);
    }

    function setup() {
      let p5Canvas = createCanvas(300, 300);
      pixelDensity(1);
      p5Canvas.parent('p5-holder');
      background(20);
      p5CanvasElt = p5Canvas.elt;
      applyScale();

      p5CanvasElt.addEventListener('mousedown', startManualPainting);
      window.addEventListener('mouseup', stopManualPainting);
      window.addEventListener('mousemove', doManualPaint);
      p5CanvasElt.addEventListener('touchstart', startManualPainting, { passive: false });
      window.addEventListener('touchend', stopManualPainting);
      window.addEventListener('touchcancel', stopManualPainting);
      window.addEventListener('touchmove', doManualPaint, { passive: false });

      const container = document.getElementById('p5-holder');
      container.addEventListener('wheel', (e) => {
        if (!p5CanvasElt) return;
        e.preventDefault();
        const zoomFactor = 1.1;
        const scaleMultiplier = e.deltaY < 0 ? zoomFactor : 1 / zoomFactor;
        const newScale = Math.max(0.05, Math.min(currentScale * scaleMultiplier, 20));
        if (newScale === currentScale) return;
        const rect = p5CanvasElt.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        currentScale = newScale;
        applyScale();
        container.scrollLeft += (mouseX * scaleMultiplier) - mouseX;
        container.scrollTop += (mouseY * scaleMultiplier) - mouseY;
      }, { passive: false });

      let initialPinchDist = null;
      let initialPinchScale = 1;
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length >= 2) {
          e.preventDefault();
          isManualPainting = false;
          initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          initialPinchScale = currentScale;
        }
      }, { passive: false });
      container.addEventListener('touchmove', (e) => {
        if (e.touches.length >= 2) {
          e.preventDefault();
          const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          const newScale = initialPinchScale * (currentDist / initialPinchDist);
          currentScale = Math.max(0.05, Math.min(newScale, 20));
          applyScale();
        }
      }, { passive: false });
    }

    function startProcessing() {
      if (!img) return;
      const thicknessPercent = parseInt(alphaSlider.value);
      if (thicknessPercent <= 50) {
        activeBristleAlpha = map(thicknessPercent, 0, 50, 0, 255);
        activeBristleStrokeWeight = 1;
        activeBristleSkip = 1;
      } else {
        activeBristleAlpha = 255;
        activeBristleStrokeWeight = map(thicknessPercent, 50, 100, 1, 5);
        activeBristleSkip = max(1, floor(activeBristleStrokeWeight));
      }
      activeBristleLengthScale = parseFloat(lengthSlider.value);
      activeBristleAngleOffset = parseInt(angleSlider.value);

      //activeDetailLevel = parseInt(detailSlider.value);
      activeLightDetailLevel = parseInt(detailLightSlider.value);
      activeShadowDetailLevel = parseInt(detailShadowSlider.value);

      activeDetailSizeMultiplier = parseFloat(detailSizeSlider.value);

      loadingOverlay.style.display = "flex";
      setTimeout(() => {
        processImage();
        loadingOverlay.style.display = "none";
      }, 100);
    }

    function processImage() {
      img.loadPixels();
      pieces = [];
      avgColor = getAverageColor(img);
      background(avgColor[0], avgColor[1], avgColor[2]);
      let quantized = quantizeImage(img, parseInt(colorSlider.value));
      let blobs = extractBlobs(quantized);
      let isRealistic = paletteModeSelect.value === 'realistic';

      for (let blob of blobs) {
        let hull = convexHull(blob.pixels);
        let angle = findBestAngle(hull);

        let finalColor;
        if (isRealistic) {
          finalColor = getBlobAverageColor(img, blob.pixels);
        } else {
          let levels = max(2, floor(pow(parseInt(colorSlider.value), 1 / 3)));
          let step = 256 / levels;
          finalColor = blob.colorKey.split(",").map(v => v * step);
        }
        pieces.push({ pixels: blob.pixels, color: finalColor, angle: angle, size: blob.pixels.length });
      }
      pieces.sort((a, b) => b.size - a.size);
      painted = false;
    }

    function saveArtwork() { saveCanvas('PainterGO_Artwork', 'png'); }

    function draw() {
      if (!ready || painted || pieces.length === 0) return;
      for (let piece of pieces) { drawBrushStroke(piece); }
      //if (activeDetailLevel > 0) { drawDetails(activeDetailLevel); }
      if (activeLightDetailLevel > 0 || activeShadowDetailLevel > 0) {
        drawDetails(activeLightDetailLevel, activeShadowDetailLevel);
      }
      painted = true;
    }

    function findBestAngle(hull) {
      let bestAngle = 0; let bestRatio = 0;
      for (let a = 0; a < 180; a += 15) {
        let rad = radians(a); let xs = [], ys = [];
        for (let p of hull) {
          xs.push(p.x * cos(rad) - p.y * sin(rad));
          ys.push(p.x * sin(rad) + p.y * cos(rad));
        }
        let w = max(xs) - min(xs); let h = max(ys) - min(ys); let ratio = w / (h + 0.0001);
        if (ratio > bestRatio) { bestRatio = ratio; bestAngle = a; }
      }
      return bestAngle;
    }

    function drawBrushStroke(piece) {
      push();
      let rad = radians((piece.angle !== undefined ? piece.angle : 0) + activeBristleAngleOffset);
      let cosA = cos(rad); let sinA = sin(rad);
      let baseLen = sqrt(piece.size) * 1.5;
      let isImpasto = activeBristleStrokeWeight > 4;

      if (!isImpasto) {
        stroke(piece.color[0], piece.color[1], piece.color[2], activeBristleAlpha);
        strokeWeight(activeBristleStrokeWeight);
      }

      for (let i = 0; i < piece.pixels.length; i += activeBristleSkip) {
        let p = piece.pixels[i];
        let len = baseLen * activeBristleLengthScale * random(0.8, 1.2);
        let spread = random(-1, 1); let startX = random(-0.5, 0.5); let startY = spread;
        let endX = len + random(-1, 1); let endY = spread + random(-0.3, 0.3);

        let x1 = p.x + startX * cosA - startY * sinA;
        let y1 = p.y + startX * sinA + startY * cosA;
        let x2 = p.x + endX * cosA - endY * sinA;
        let y2 = p.y + endX * sinA + endY * cosA;

        if (isImpasto) {
          let offset = activeBristleStrokeWeight / 2;
          strokeWeight(2); stroke(piece.color[0] * 0.5, piece.color[1] * 0.5, piece.color[2] * 0.5, 32);
          line(x1, y1 + offset, x2, y2 + offset);
          strokeWeight(activeBristleStrokeWeight); stroke(piece.color[0], piece.color[1], piece.color[2], activeBristleAlpha);
          line(x1, y1, x2, y2);
          strokeWeight(2); stroke(piece.color[0] + 10, piece.color[1] + 10, piece.color[2] + 10, 128);
          line(x1, y1 - (offset / 2), x2, y2 - (offset / 2));
        } else { line(x1, y1, x2, y2); }
      }
      pop();
    }

    //function drawDetails(level) {
    function drawDetails(lightLevel, shadowLevel) {
      push();
      //let attempts = floor((img.width * img.height) * (level / 100) * 2.5);
      //let threshold = map(level, 0, 100, 60, 15);
      let level = Math.max(lightLevel, shadowLevel);

      let attempts = floor((img.width * img.height) * (level / 100) * 2.5);
      let threshold = map(level, 0, 100, 60, 15);

      let isImpasto = activeBristleStrokeWeight > 4;
      let detailWeight = isImpasto ? max(1.5, activeBristleStrokeWeight / 2.5) : map(level, 0, 100, 0.5, 1.5);

      strokeWeight(detailWeight);
      strokeCap(ROUND);

      for (let i = 0; i < attempts; i++) {
        let x = floor(random(1, img.width - 1));
        let y = floor(random(1, img.height - 1));
        let idxRight = (y * img.width + (x + 1)) * 4;
        let idxLeft = (y * img.width + (x - 1)) * 4;
        let idxDown = ((y + 1) * img.width + x) * 4;
        let idxUp = ((y - 1) * img.width + x) * 4;

        let lumX = (0.299 * img.pixels[idxRight] + 0.587 * img.pixels[idxRight + 1] + 0.114 * img.pixels[idxRight + 2]) -
          (0.299 * img.pixels[idxLeft] + 0.587 * img.pixels[idxLeft + 1] + 0.114 * img.pixels[idxLeft + 2]);
        let lumY = (0.299 * img.pixels[idxDown] + 0.587 * img.pixels[idxDown + 1] + 0.114 * img.pixels[idxDown + 2]) -
          (0.299 * img.pixels[idxUp] + 0.587 * img.pixels[idxUp + 1] + 0.114 * img.pixels[idxUp + 2]);

        let mag = sqrt(lumX * lumX + lumY * lumY);

        if (mag > threshold) {
          let angle = atan2(lumY, lumX) + HALF_PI;
          let idxCenter = (y * img.width + x) * 4;
          let r = img.pixels[idxCenter];
          let g = img.pixels[idxCenter + 1];
          let b = img.pixels[idxCenter + 2];
          let lum = 0.299 * r + 0.587 * g + 0.114 * b;

          let strokeLen = random(3, 8) * activeBristleLengthScale;

          //if (lum > 128) stroke(min(r + 80, 255), min(g + 80, 255), min(b + 80, 255), 210);
          //else stroke(max(r - 80, 0), max(g - 80, 0), max(b - 80, 0), 210);
          if (lum > 128) {

            if (lightLevel <= 0) continue;

            let s = lightLevel / 100;

            stroke(
              min(r + 80 * s, 255),
              min(g + 80 * s, 255),
              min(b + 80 * s, 255),
              210
            );

          } else {

            if (shadowLevel <= 0) continue;

            let s = shadowLevel / 100;

            stroke(
              max(r - 80 * s, 0),
              max(g - 80 * s, 0),
              max(b - 80 * s, 0),
              210
            );
          }

          let dx = cos(angle) * strokeLen / 2;
          let dy = sin(angle) * strokeLen / 2;

          if (isImpasto) {
            push();
            strokeWeight(detailWeight);
            stroke(max(r - 100, 0), max(g - 100, 0), max(b - 100, 0), 100);
            line(x - dx, (y - dy) + detailWeight / 1.5, x + dx, (y + dy) + detailWeight / 1.5);
            pop();
          }
          line(x - dx, y - dy, x + dx, y + dy);
        }
      }
      pop();
    }

    function getAverageColor(img) {
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < img.pixels.length; i += 40) {
        r += img.pixels[i]; g += img.pixels[i + 1]; b += img.pixels[i + 2]; count++;
      }
      return [r / count, g / count, b / count];
    }

    function getBlobAverageColor(img, pixels) {
      let r = 0, g = 0, b = 0;
      for (let p of pixels) {
        let idx = (p.y * img.width + p.x) * 4;
        r += img.pixels[idx]; g += img.pixels[idx + 1]; b += img.pixels[idx + 2];
      }
      return [r / pixels.length, g / pixels.length, b / pixels.length];
    }

    function quantizeImage(img, numColors) {
      let result = new Int32Array(img.width * img.height);
      let levels = max(2, floor(pow(numColors, 1 / 3)));
      let step = 256 / levels;
      for (let i = 0; i < img.pixels.length; i += 4) {
        let r = floor(img.pixels[i] / step);
        let g = floor(img.pixels[i + 1] / step);
        let b = floor(img.pixels[i + 2] / step);
        result[i / 4] = (r << 16) | (g << 8) | b;
      }
      return result;
    }

    function extractBlobs(quantized) {
      let blobs = [];
      let visited = new Uint8Array(quantized.length);
      for (let i = 0; i < quantized.length; i++) {
        if (visited[i]) continue;
        let colorKey = quantized[i];
        let pixels = [];
        let stack = [i];
        visited[i] = 1;
        while (stack.length > 0) {
          let curr = stack.pop();
          let x = curr % width, y = floor(curr / width);
          pixels.push({ x, y });
          let neighbors = [curr - 1, curr + 1, curr - width, curr + width];
          for (let n of neighbors) {
            if (n >= 0 && n < quantized.length && !visited[n] && quantized[n] === colorKey) {
              visited[n] = 1;
              stack.push(n);
            }
          }
        }
        if (pixels.length > 5) {
          let r = (colorKey >> 16) & 0xFF, g = (colorKey >> 8) & 0xFF, b = colorKey & 0xFF;
          blobs.push({ colorKey: `${r},${g},${b}`, pixels: pixels });
        }
      }
      return blobs;
    }

    function convexHull(points) {
      if (points.length <= 3) return points;
      points.sort((a, b) => a.x !== b.x ? a.x - b.x : a.y - b.y);
      const upper = [], lower = [];
      for (let p of points) {
        while (upper.length >= 2 && crossProduct(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
        upper.push(p);
      }
      for (let i = points.length - 1; i >= 0; i--) {
        let p = points[i];
        while (lower.length >= 2 && crossProduct(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
        lower.push(p);
      }
      upper.pop(); lower.pop();
      return upper.concat(lower);
    }

    function crossProduct(a, b, c) { return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x); }

    // ==========================================
    // MANUAL PAINTING LOGIC
    // ==========================================
    let isManualMode = false;
    let isManualPainting = false;
    const autoUI = document.getElementById('auto-ui');
    const manualUI = document.getElementById('manual-ui');
    const btnToggleManual = document.getElementById('btn-toggle-manual');
    const manualColorInput = document.getElementById('manualColor');
    const manualSizeInput = document.getElementById('manualSize');
    const manualAlphaInput = document.getElementById('manualAlpha');
    const manualBlendInput = document.getElementById('manualBlend');
    const manualBristlesInput = document.getElementById('manualBristles');
    const manualDampingInput = document.getElementById('manualDamping');
    const brushPreviewCanvas = document.getElementById('brush-preview-canvas');

    let brush = { x: 0, y: 0, px: 0, py: 0, color: '#ffeb3b', size: 40, bristleCount: 30, bristles: [], dampingFactor: 0.15, currentPressure: 0.5, alpha: 1.0, blend: 0.0 };

    function hexToRgb(hex) {
      let c = hex.substring(1).split('');
      if (c.length === 3) { c = [c[0], c[0], c[1], c[1], c[2], c[2]]; }
      c = '0x' + c.join('');
      return { r: (c >> 16) & 255, g: (c >> 8) & 255, b: c & 255 };
    }

    function toggleManualMode() {
      isManualMode = !isManualMode;
      if (isManualMode) {
        autoUI.style.display = 'none';
        manualUI.style.display = 'flex';
        btnToggleManual.innerText = '🖼️ Switch to Auto Paint';
        btnToggleManual.style.background = '#4caf50';
        initializeBristles();
        updateBrushPreview();
      } else {
        autoUI.style.display = 'block';
        manualUI.style.display = 'none';
        btnToggleManual.innerText = '🖌️ Switch to Manual Paint';
        btnToggleManual.style.background = '#ff9800';
      }
    }

    function initializeBristles() {
      brush.bristles = [];
      for (let i = 0; i < brush.bristleCount; i++) {
        let angle = Math.random() * Math.PI * 2;
        let radius = Math.random() * brush.size;
        brush.bristles.push({
          ox: Math.cos(angle) * radius, oy: Math.sin(angle) * radius,
          x: 0, y: 0, px: 0, py: 0
        });
      }
    }

    function updateBrushPreview() {
      const ctx = brushPreviewCanvas.getContext('2d');
      const w = brushPreviewCanvas.width = brushPreviewCanvas.offsetWidth;
      const h = brushPreviewCanvas.height = brushPreviewCanvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      let rgb = hexToRgb(brush.color);
      ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${brush.alpha})`;
      ctx.lineWidth = 2;
      const cx = w / 2, cy = h / 2;
      for (let b of brush.bristles) {
        ctx.beginPath();
        ctx.arc(cx + b.ox, cy + b.oy, 1.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.arc(cx, cy, brush.size, 0, Math.PI * 2);
      ctx.stroke();
    }

    function startManualPainting(e) {
      if (!isManualMode) return;
      isManualPainting = true;
      updateManualPosition(e);
      brush.px = brush.x; brush.py = brush.y;
      for (let b of brush.bristles) {
        b.x = b.px = brush.x + b.ox;
        b.y = b.py = brush.y + b.oy;
      }
    }

    function stopManualPainting() { isManualPainting = false; }

    function doManualPaint(e) {
      if (!isManualMode || !isManualPainting) return;
      updateManualPosition(e);
      drawManualStroke();
      brush.px = brush.x; brush.py = brush.y;
    }

    function updateManualPosition(e) {
      const rect = p5CanvasElt.getBoundingClientRect();
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      brush.x = (clientX - rect.left) / currentScale;
      brush.y = (clientY - rect.top) / currentScale;
      brush.currentPressure = e.touches ? (e.touches[0].force || 0.5) : 0.5;
    }

    function drawManualStroke() {
      const ctx = p5CanvasElt.getContext('2d');
      ctx.lineCap = 'round';

      let baseRGB = hexToRgb(brush.color);
      let bMinX = Infinity, bMaxX = -Infinity, bMinY = Infinity, bMaxY = -Infinity;

      // Pre-calculate positions and get bounding box for canvas sampling
      for (let b of brush.bristles) {
        b.px = b.x; b.py = b.y;
        let targetX = brush.x + b.ox;
        let targetY = brush.y + b.oy;
        b.x += (targetX - b.x) * brush.dampingFactor;
        b.y += (targetY - b.y) * brush.dampingFactor;

        if (brush.blend > 0) {
          if (b.px < bMinX) bMinX = b.px;
          if (b.x < bMinX) bMinX = b.x;
          if (b.px > bMaxX) bMaxX = b.px;
          if (b.x > bMaxX) bMaxX = b.x;

          if (b.py < bMinY) bMinY = b.py;
          if (b.y < bMinY) bMinY = b.y;
          if (b.py > bMaxY) bMaxY = b.py;
          if (b.y > bMaxY) bMaxY = b.y;
        }
      }

      let imgData = null;
      let minX = 0, minY = 0;
      if (brush.blend > 0 && bMinX !== Infinity) {
        minX = Math.floor(Math.max(0, bMinX - 2));
        minY = Math.floor(Math.max(0, bMinY - 2));
        let maxX = Math.ceil(Math.min(width, bMaxX + 2));
        let maxY = Math.ceil(Math.min(height, bMaxY + 2));
        let boxW = maxX - minX;
        let boxH = maxY - minY;
        if (boxW > 0 && boxH > 0) {
          imgData = ctx.getImageData(minX, minY, boxW, boxH);
        }
      }

      for (let b of brush.bristles) {
        let bristleR = baseRGB.r;
        let bristleG = baseRGB.g;
        let bristleB = baseRGB.b;

        if (imgData && brush.blend > 0) {
          let lx = Math.floor(b.x) - minX;
          let ly = Math.floor(b.y) - minY;
          if (lx >= 0 && lx < imgData.width && ly >= 0 && ly < imgData.height) {
            let idx = (ly * imgData.width + lx) * 4;
            let cR = imgData.data[idx];
            let cG = imgData.data[idx + 1];
            let cB = imgData.data[idx + 2];
            bristleR = bristleR * (1 - brush.blend) + cR * brush.blend;
            bristleG = bristleG * (1 - brush.blend) + cG * brush.blend;
            bristleB = bristleB * (1 - brush.blend) + cB * brush.blend;
          }
        }

        ctx.strokeStyle = `rgba(${bristleR}, ${bristleG}, ${bristleB}, ${brush.alpha})`;

        ctx.beginPath();
        ctx.moveTo(b.px, b.py);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    manualColorInput.addEventListener('input', (e) => { brush.color = e.target.value; updateBrushPreview(); });
    manualSizeInput.addEventListener('input', (e) => {
      brush.size = parseInt(e.target.value, 10);
      document.getElementById('manSizeVal').textContent = brush.size;
      initializeBristles(); updateBrushPreview();
    });
    manualAlphaInput.addEventListener('input', (e) => {
      brush.alpha = parseInt(e.target.value, 10) / 100;
      document.getElementById('manAlphaVal').textContent = e.target.value + '%';
      updateBrushPreview();
    });
    manualBlendInput.addEventListener('input', (e) => {
      brush.blend = parseInt(e.target.value, 10) / 100;
      document.getElementById('manBlendVal').textContent = e.target.value + '%';
    });
    manualBristlesInput.addEventListener('input', (e) => {
      brush.bristleCount = parseInt(e.target.value, 10);
      document.getElementById('manBristleVal').textContent = brush.bristleCount;
      initializeBristles(); updateBrushPreview();
    });
    manualDampingInput.addEventListener('input', (e) => {
      brush.dampingFactor = parseFloat(e.target.value) / 100;
      if (brush.dampingFactor === 0) brush.dampingFactor = 0.01;
      document.getElementById('manDampingVal').textContent = brush.dampingFactor.toFixed(2);
    });

    window.onload = () => { if (typeof updateBrushPreview === 'function') updateBrushPreview(); };

  </script>
</body>
