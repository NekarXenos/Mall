<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>p5 Painter - Enhanced</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  body { 
    margin: 0; 
    background: #1a1a1a; 
    color: #fff; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  
  #ui {
    width: 280px;
    background: #252525;
    padding: 20px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border-right: 1px solid #333;
    position: relative;
    overflow-y: auto;
  }

  .canvas-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    position: relative;
    overflow: auto;
  }

  h2 { margin: 0 0 5px 0; font-size: 1.2rem; color: #aaa; }

  .control-group {
    background: #333;
    padding: 12px;
    border-radius: 6px;
  }

  label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
  
  input[type="range"] { width: 100%; cursor: pointer; }
  
  select {
    width: 100%;
    padding: 8px;
    background: #444;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    margin-bottom: 5px;
  }

  .btn-paint { background: #4caf50; color: white; }
  .btn-paint:hover { background: #45a049; }
  .btn-save { background: #2196f3; color: white; }
  .btn-save:hover { background: #1e88e5; }

  #preview-container {
    margin-top: 10px;
    border: 2px solid #444;
    border-radius: 4px;
    background: #000;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #imgPreview {
    max-width: 100%;
    max-height: 200px;
    display: none;
  }

  .placeholder-text { color: #555; font-size: 0.8rem; text-align: center; }

  /* Loading Overlay */
  #loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    color: #4caf50;
    font-weight: bold;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #333;
    border-top: 4px solid #4caf50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="ui">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div>Calculating Brush Strokes...</div>
  </div>

  <h2>PainterGO</h2>
  
  <div class="control-group">
    <label>1. Upload Photo</label>
    <input type="file" id="upload" accept="image/*">
  </div>

  <div class="control-group">
    <label>2. Colors: <span id="colVal">64</span></label>
    <input type="range" id="colorSlider" min="2" max="256" value="256">
  </div>

  <div class="control-group">
    <label>3. Palette Style</label>
    <select id="paletteMode">
      <option value="realistic" selected>Realistic (Averaged)</option>
      <option value="poster">Poster (High Contrast)</option>
    </select>
  </div>

  <div class="control-group">
    <label>4. Bristle Length: <span id="lenVal">1.0</span>x</label>
    <input type="range" id="lengthSlider" min="0.1" max="5.0" step="0.1" value="1.0">
  </div>

  <div class="control-group">
    <label>5. Paint Thickness: <span id="alphaVal">120</span></label>
    <input type="range" id="alphaSlider" min="10" max="255" value="128">
  </div>

  <div class="control-group">
    <label>6. Angle Offset: <span id="angleVal">0&deg;</span></label>
    <div style="display: flex; align-items: center; gap: 10px;">
      <input type="range" id="angleSlider" min="-180" max="180" value="0" style="flex-grow: 1;">
      <div id="angleWheel" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #aaa; position: relative; display: flex; justify-content: center; transform: rotate(0deg);">
        <div style="width: 2px; height: 10px; background: #4caf50; border-radius: 2px;"></div>
      </div>
    </div>
  </div>

  <button class="btn-paint" onclick="startProcessing()">Start Painting</button>
  <button class="btn-save" onclick="saveArtwork()">Save Image</button>

  <label style="margin-top:10px;">Source Preview:</label>
  <div id="preview-container">
    <span class="placeholder-text" id="previewLabel">No image selected</span>
    <img id="imgPreview" alt="Preview">
  </div>
</div>

<div class="canvas-container" id="p5-holder"></div>

<script>
let img;
let pieces = [];
let painted = false;
let ready = false;
let colorCount = 256;
let bristleAngleOffset = 0;
let bristleLengthScale = 1.0;
let bristleAlpha = 128;
let avgColor = [20, 20, 20];

const uploadInput = document.getElementById("upload");
const colorSlider = document.getElementById("colorSlider");
const colValLabel = document.getElementById("colVal");
const imgPreview = document.getElementById("imgPreview");
const previewLabel = document.getElementById("previewLabel");
const angleSlider = document.getElementById("angleSlider");
const angleValLabel = document.getElementById("angleVal");
const angleWheel = document.getElementById("angleWheel");
const loadingOverlay = document.getElementById("loading-overlay");
const paletteModeSelect = document.getElementById("paletteMode");

const lengthSlider = document.getElementById("lengthSlider");
const lenValLabel = document.getElementById("lenVal");
const alphaSlider = document.getElementById("alphaSlider");
const alphaValLabel = document.getElementById("alphaVal");

uploadInput.addEventListener("change", handleUpload);

colorSlider.addEventListener("input", e => {
  colorCount = parseInt(e.target.value);
  colValLabel.innerText = colorCount;
});

function requestRepaint() {
  if (pieces.length > 0) {
    background(avgColor[0], avgColor[1], avgColor[2]);
    painted = false;
  }
}

lengthSlider.addEventListener("input", e => {
  bristleLengthScale = parseFloat(e.target.value);
  lenValLabel.innerText = bristleLengthScale.toFixed(1);
  requestRepaint();
});

alphaSlider.addEventListener("input", e => {
  bristleAlpha = parseInt(e.target.value);
  alphaValLabel.innerText = bristleAlpha;
  requestRepaint();
});

angleSlider.addEventListener("input", e => {
  bristleAngleOffset = parseInt(e.target.value);
  angleValLabel.innerHTML = bristleAngleOffset + '&deg;';
  angleWheel.style.transform = `rotate(${bristleAngleOffset}deg)`;
  requestRepaint();
});

function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    imgPreview.src = e.target.result;
    imgPreview.style.display = "block";
    previewLabel.style.display = "none";

    loadImage(e.target.result, loaded => {
      img = loaded;
      resizeCanvas(img.width, img.height);
      ready = true;
      painted = false;
      background(20);
    });
  };
  reader.readAsDataURL(file);
}

function setup() {
  const canvas = createCanvas(300, 300);
  canvas.parent('p5-holder');
  background(20);
}

function startProcessing() {
  if (!img) return;
  loadingOverlay.style.display = "flex";
  setTimeout(() => {
    processImage();
    loadingOverlay.style.display = "none";
  }, 50);
}

function processImage() {
  img.loadPixels();
  pieces = [];

  avgColor = getAverageColor(img);
  background(avgColor[0], avgColor[1], avgColor[2]);

  let quantized = quantizeImage(img, colorCount);
  let blobs = extractBlobs(quantized);
  let isRealistic = paletteModeSelect.value === 'realistic';

  for (let blob of blobs) {
    let hull = convexHull(blob.pixels);
    let angle = findBestAngle(hull);
    
    let finalColor;
    if (isRealistic) {
      finalColor = getBlobAverageColor(img, blob.pixels);
    } else {
      let levels = max(2, floor(pow(colorCount, 1/3)));
      let step = 256 / levels;
      finalColor = blob.colorKey.split(",").map(v => v * step);
    }

    pieces.push({
      pixels: blob.pixels,
      color: finalColor,
      angle: angle,
      size: blob.pixels.length
    });
  }

  // Large strokes first (background/base), small strokes last (detail)
  pieces.sort((a, b) => b.size - a.size);
  painted = false;
}

function saveArtwork() {
  saveCanvas('my_painting', 'png');
}

function draw() {
  if (!ready || painted || pieces.length === 0) return;

  for (let piece of pieces) {
    drawBrushStroke(piece);
  }

  painted = true;
}

function getAverageColor(img) {
  let r=0,g=0,b=0;
  let total = img.pixels.length / 4;
  for (let i = 0; i < img.pixels.length; i += 4) {
    r += img.pixels[i];
    g += img.pixels[i+1];
    b += img.pixels[i+2];
  }
  return [r/total, g/total, b/total];
}

function getBlobAverageColor(img, pixels) {
  let r=0, g=0, b=0;
  for (let p of pixels) {
    let i = (floor(p.x) + floor(p.y) * img.width) * 4;
    r += img.pixels[i];
    g += img.pixels[i+1];
    b += img.pixels[i+2];
  }
  let count = pixels.length;
  return [r/count, g/count, b/count];
}

function quantizeImage(img, colorCount) {
  let levels = max(2, floor(pow(colorCount, 1/3)));
  let step = 256 / levels;
  let map = [];
  for (let y = 0; y < img.height; y++) {
    map[y] = [];
    for (let x = 0; x < img.width; x++) {
      let i = (x + y * img.width) * 4;
      let r = floor(img.pixels[i] / step);
      let g = floor(img.pixels[i+1] / step);
      let b = floor(img.pixels[i+2] / step);
      map[y][x] = `${r},${g},${b}`;
    }
  }
  return { map, levels, step };
}

function extractBlobs(data) {
  let map = data.map;
  let visited = Array.from({length: map.length}, () => Array(map[0].length).fill(false));
  let blobs = [];
  let dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[0].length; x++) {
      if (visited[y][x]) continue;

      let colorKey = map[y][x];
      let stack = [[x,y]];
      let pixels = [];

      while (stack.length) {
        let [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= map[0].length || cy >= map.length) continue;
        if (visited[cy][cx] || map[cy][cx] !== colorKey) continue;

        visited[cy][cx] = true;
        pixels.push(createVector(cx, cy));
        for (let d of dirs) stack.push([cx + d[0], cy + d[1]]);
      }
      if (pixels.length > 20) blobs.push({ pixels, colorKey });
    }
  }
  return blobs;
}

function convexHull(points) {
  if (points.length < 3) return points;
  points.sort((a,b)=> a.x === b.x ? a.y - b.y : a.x - b.x);
  let cross = (o,a,b)=> (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  let lower = [];
  for (let p of points) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  let upper = [];
  for (let i = points.length - 1; i >= 0; i--) {
    let p = points[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function findBestAngle(hull) {
  let bestAngle = 0;
  let bestRatio = 0;
  for (let a = 0; a < 180; a += 15) {
    let rad = radians(a);
    let xs = [], ys = [];
    for (let p of hull) {
      xs.push(p.x * cos(rad) - p.y * sin(rad));
      ys.push(p.x * sin(rad) + p.y * cos(rad));
    }
    let w = max(xs) - min(xs);
    let h = max(ys) - min(ys);
    let ratio = w / (h + 0.0001);
    if (ratio > bestRatio) { bestRatio = ratio; bestAngle = a; }
  }
  return bestAngle;
}

function drawBrushStroke(piece) {
  push();
  stroke(piece.color[0], piece.color[1], piece.color[2], bristleAlpha);
  
  let rad = radians((piece.angle !== undefined ? piece.angle : 0) + bristleAngleOffset);
  let cosA = cos(rad);
  let sinA = sin(rad);

  // Proportionality: Base length is derived from the square root of piece size
  // sqrt(20) is approx 4.5, sqrt(1000) is approx 31.
  let baseLen = sqrt(piece.size) * 1.5;

  for (let p of piece.pixels) {
    // Final length = baseLen * GUI Scale * random variation
    let len = baseLen * bristleLengthScale * random(0.8, 1.2);
    
    for (let i = 0; i < 3; i++) {
      let spread = random(-1.5, 1.5);
      let startX = random(-0.5, 0.5);
      let startY = spread;
      let endX = len + random(-1, 1);
      let endY = spread + random(-0.3, 0.3);

      let x1 = p.x + startX * cosA - startY * sinA;
      let y1 = p.y + startX * sinA + startY * cosA;
      let x2 = p.x + endX * cosA - endY * sinA;
      let y2 = p.y + endX * sinA + endY * cosA;

      line(x1, y1, x2, y2);
    }
  }
  pop();
}
</script>
</body>
</html>
